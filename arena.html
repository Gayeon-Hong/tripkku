/* ===== Apps in Toss (game type): Toss draws "⋯ / X" at the top-right over our screen =====
   Safe Area guide: X sits at insets.top + 5~10px, insets.right + 10px. Keep our controls clear of it. */

.in-toss .bottom-nav{padding-bottom:calc(10px + max(env(safe-area-inset-bottom,0px),var(--toss-bottom,0px)))}
.filters button{min-height:40px;font-size:12px;padding:8px 16px} /* comfortable tap targets on phones */
.in-toss .wallet-link{min-height:40px}

/* ===== Per-game color themes (colorful, both day & night) =====
   html[data-game] is set on intro / game / result screens; cards use the color class directly. */
.violet{--g:#8b6cff;--g-deep:#2a2257;--g-pastel:#ece8ff;--g-ink:#5a3fd0}
.amber {--g:#f5a524;--g-deep:#3a2b10;--g-pastel:#fdf0d9;--g-ink:#a3660a}
.teal  {--g:#19c2ad;--g-deep:#0f3330;--g-pastel:#dcf5f1;--g-ink:#0f7f72}
.rose  {--g:#ff5c7a;--g-deep:#3d1621;--g-pastel:#ffe3e9;--g-ink:#c22f4e}
.green {--g:#3fcf6e;--g-deep:#123321;--g-pastel:#def6e5;--g-ink:#1e8a45}
.sky   {--g:#33b5ff;--g-deep:#0e2c44;--g-pastel:#dcf0fd;--g-ink:#1675b8}
.coral {--g:#ff8a4c;--g-deep:#3d1f10;--g-pastel:#ffe9dc;--g-ink:#c25a20}
.lime  {--g:#a3d13a;--g-deep:#25300e;--g-pastel:#eef6d6;--g-ink:#5b7a12}
.pink  {--g:#ff6fc8;--g-deep:#3a1430;--g-pastel:#ffe4f4;--g-ink:#b8287f}
.indigo{--g:#6c7bff;--g-deep:#1c2150;--g-pastel:#e6e9ff;--g-ink:#3f4cc9}
.red   {--g:#ff4d5e;--g-deep:#3d1117;--g-pastel:#ffe2e5;--g-ink:#c0212f}
.cyan  {--g:#22cfe6;--g-deep:#0c3138;--g-pastel:#d9f6fa;--g-ink:#0b7d8c}
.plum  {--g:#b569ff;--g-deep:#2d1745;--g-pastel:#f1e5ff;--g-ink:#7b34c4}
.game-art.violet,.game-art.amber,.game-art.teal,.game-art.rose,.game-art.green,.game-art.sky,.game-art.coral,.game-art.lime,.game-art.pink,.game-art.indigo,.game-art.red,.game-art.cyan,.game-art.plum,
.detail-hero.violet,.detail-hero.amber,.detail-hero.teal,.detail-hero.rose,.detail-hero.green,.detail-hero.sky,.detail-hero.coral,.detail-hero.lime,.detail-hero.pink,.detail-hero.indigo,.detail-hero.red,.detail-hero.cyan,.detail-hero.plum{
  background:radial-gradient(120% 140% at 85% 0%,color-mix(in srgb,var(--g) 45%,transparent) 0%,transparent 60%),var(--g-deep);color:#fff}
[data-theme="light"] .game-art:is(.violet,.amber,.teal,.rose,.green,.sky,.coral,.lime,.pink,.indigo,.red,.cyan,.plum),
[data-theme="light"] .detail-hero:is(.violet,.amber,.teal,.rose,.green,.sky,.coral,.lime,.pink,.indigo,.red,.cyan,.plum){
  background:radial-gradient(120% 140% at 85% 0%,color-mix(in srgb,var(--g) 30%,transparent) 0%,transparent 62%),var(--g-pastel);color:var(--g-ink)}
.game-art .art-caption,.game-art .art-index{opacity:.85}

/* in-game accent follows the game color */
html[data-game]{--accent:var(--gx);--accent-hover:var(--gx);--accent-ink:var(--gx-ink);--accent-soft:var(--gx-soft);--focus:var(--gx-ink)}

html[data-game="amber"] {--gx:#c9800f;--gx-ink:#ffcd7a;--gx-soft:#3a2b10}
html[data-game="teal"]  {--gx:#12968a;--gx-ink:#7fe6d8;--gx-soft:#0f3330}
html[data-game="rose"]  {--gx:#d93a5c;--gx-ink:#ff9fb2;--gx-soft:#3d1621}
html[data-game="green"] {--gx:#24a352;--gx-ink:#8ff0ad;--gx-soft:#123321}
html[data-game="sky"]   {--gx:#1d8fd6;--gx-ink:#8fd3ff;--gx-soft:#0e2c44}
html[data-game="coral"] {--gx:#e0662a;--gx-ink:#ffb48a;--gx-soft:#3d1f10}
html[data-game="lime"]  {--gx:#6f9a17;--gx-ink:#c8ec7a;--gx-soft:#25300e}
html[data-game="pink"]  {--gx:#d43e9c;--gx-ink:#ffa6dc;--gx-soft:#3a1430}
html[data-game="indigo"]{--gx:#5463e6;--gx-ink:#b3bcff;--gx-soft:#1c2150}
html[data-game="red"]   {--gx:#e0384a;--gx-ink:#ffa3ac;--gx-soft:#3d1117}
html[data-game="cyan"]  {--gx:#0f9fb3;--gx-ink:#8be9f5;--gx-soft:#0c3138}
html[data-game="plum"]  {--gx:#9150dc;--gx-ink:#d4b0ff;--gx-soft:#2d1745}
html[data-theme="light"][data-game="violet"]{--gx-ink:#5a3fd0;--gx-soft:#ece8ff}
html[data-theme="light"][data-game="amber"] {--gx:#b8720a;--gx-ink:#94600a;--gx-soft:#fbefd8}
html[data-theme="light"][data-game="teal"]  {--gx:#0f8a7d;--gx-ink:#0c7166;--gx-soft:#dcf3ef}
html[data-theme="light"][data-game="rose"]  {--gx-ink:#b42a48;--gx-soft:#fde3e9}
html[data-theme="light"][data-game="green"] {--gx:#1e8f46;--gx-ink:#18793b;--gx-soft:#dff4e6}
html[data-theme="light"][data-game="sky"]   {--gx:#1b7fc2;--gx-ink:#16689e;--gx-soft:#ddeefb}
html[data-theme="light"][data-game="coral"] {--gx:#cf5a1f;--gx-ink:#a8481a;--gx-soft:#fde8dc}
html[data-theme="light"][data-game="lime"]  {--gx:#5f8512;--gx-ink:#4d6c0e;--gx-soft:#ecf4d4}
html[data-theme="light"][data-game="pink"]  {--gx:#c2348c;--gx-ink:#a52677;--gx-soft:#fce3f2}
html[data-theme="light"][data-game="indigo"]{--gx:#4553d6;--gx-ink:#3a46b8;--gx-soft:#e5e8fd}
html[data-theme="light"][data-game="red"]   {--gx:#cf2c3e;--gx-ink:#b02232;--gx-soft:#fde2e5}
html[data-theme="light"][data-game="cyan"]  {--gx:#0b8597;--gx-ink:#0a6e7c;--gx-soft:#d7f3f7}
html[data-theme="light"][data-game="plum"]  {--gx:#8443cf;--gx-ink:#7034b5;--gx-soft:#f0e4fd}
html[data-game] .score-panel strong,html[data-game] .round-tag,html[data-game] .mini-kicker{color:var(--accent-ink)}
html[data-game] .round-tag{background:var(--accent-soft)}

/* ===== New games: shared buttons ===== */
.primary-btn{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:15px}
.primary-btn:disabled{opacity:.45}
.ghost-btn{min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--text);font-weight:700}
.choice-btn{flex:1;min-height:56px;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:14px}
.choice-btn:disabled{opacity:.35}

/* 숫자 탐정 */
.bb-slots{display:flex;justify-content:center;gap:12px;margin:6px 0 16px}
.bb-slot{width:64px;height:78px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font:800 40px system-ui;color:var(--text)}
.bb-slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.bb-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bb-pad button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font:800 22px system-ui}
.bb-pad button:disabled{opacity:.3}
.bb-actions{display:flex;gap:8px;margin:12px 0}
.bb-actions .primary-btn{flex:1}
.bb-log{display:grid;gap:6px;max-height:240px;overflow:auto}
.bb-log div{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:14px}
.bb-log span{color:var(--muted);width:22px}.bb-log b{letter-spacing:.2em;font-size:17px;flex:1}
.bb-log em{font-style:normal;font-weight:800;color:var(--accent-ink)}.bb-log em.hit{color:#fff;background:var(--accent);padding:2px 8px;border-radius:8px}
.bb-log p{color:var(--muted);font-size:12px;text-align:center;margin:6px 0}

/* 마지막 한 개 */
.nim-score{display:flex;justify-content:space-around;font-size:13px;color:var(--muted);margin-bottom:10px}.nim-score b{font-size:20px;color:var(--accent-ink)}
.nim-pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:var(--surface-2);min-height:84px}
.nim-stone{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffcc,transparent 45%),var(--accent);box-shadow:0 3px 0 #0003}
.nim-stone.last{background:radial-gradient(circle at 35% 30%,#ffffffcc,transparent 45%),#ff5c7a}
.nim-count{text-align:center;margin:10px 0 0;color:var(--muted)}.nim-count b{font-size:22px;color:var(--text)}
.nim-actions{display:flex;gap:8px}

/* 칩 경매 */
.auc-lot{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--accent-soft);margin-bottom:12px}
.auc-lot.trap{background:#ff5c7a22;outline:1px solid #ff5c7a66}
.auc-icon{font-size:44px;line-height:1}.auc-lot strong{display:block;font-size:19px}.auc-lot small{color:var(--muted);font-size:13px}
.auc-wallets{display:flex;gap:8px;margin-bottom:12px}.auc-wallets div{flex:1;background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.auc-wallets span{display:block;font-size:11px;color:var(--muted)}.auc-wallets b{font-size:22px}
.auc-bid{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.auc-bid button{width:52px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:800}
.auc-bid strong{flex:1;text-align:center;font:800 34px system-ui;color:var(--accent-ink)}.auc-bid small{font-size:14px;margin-left:2px}
.auc-bag{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}.auc-bag i{font-style:normal;font-size:22px}.auc-bag em{font-style:normal}

/* card art for new games */
.bb-ball{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 20px system-ui;background:#fff;color:#1e8a45;box-shadow:0 4px 0 #0002;margin:0 -4px}
.game-art .nim-stone{width:22px;height:22px;margin:0 2px;background:radial-gradient(circle at 35% 30%,#fff,transparent 45%),var(--g)}
.game-art .nim-stone.last{background:radial-gradient(circle at 35% 30%,#fff,transparent 45%),#ff5c7a}
.auc-item{font-size:34px;filter:drop-shadow(0 4px 4px #0003);margin:0 2px}

/* 닿지 마! / 그대로 그리기 */
#tracer{display:block;width:100%;max-width:340px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
#tracer[data-kind="draw"]{max-width:320px}
#tracer[data-kind="maze"]{max-width:290px}
.maze-wall{fill:color-mix(in srgb,var(--accent) 30%,var(--surface-3))}
.maze-road{fill:none;stroke:var(--tile);stroke-linecap:round;stroke-linejoin:round}
.maze-guide{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 6;opacity:.8}
.maze-start{fill:#3fcf6e;opacity:.85}
.maze-label{font:800 10px system-ui;fill:#0d2a17;text-anchor:middle}
.maze-goal{font-size:24px;text-anchor:middle}
.tracer-trail{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tracer-dot{fill:var(--accent);stroke:#fff;stroke-width:2}
#tracer.touched .maze-wall{fill:color-mix(in srgb,var(--bad) 35%,var(--surface-3))}
.draw-board{fill:var(--surface-2)}
.draw-guide{fill:none;stroke:var(--subtle);stroke-width:3;stroke-dasharray:6 7;opacity:.55}
.draw-guide.strong{stroke:var(--accent-ink);opacity:.95}
.art-maze{width:120px;height:60px}.art-maze path{fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;opacity:.9}
.art-draw{font-size:30px;margin:0 6px;opacity:.95}

/* 서바이벌 4종 */
.art-emo{font-size:30px;margin:0 4px}.art-tag{font:800 12px system-ui;opacity:.9;margin-left:6px}.art-tag.big{font-size:26px;margin:0 8px}.art-dots{font-size:18px;opacity:.7}
.art-mb{display:inline-flex;gap:4px}.art-mb i{width:13px;height:13px;border-radius:50%;background:currentColor;opacity:.85;display:block}
.art-bridge{display:grid;grid-template-columns:repeat(2,18px);gap:5px}.art-bridge i{height:12px;border-radius:3px;border:2px solid currentColor;opacity:.55;display:block}.art-bridge i.s{background:currentColor;opacity:.95}
.mb-board{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}.mb-board>div:not(.mb-fist){flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.mb-board small{font-size:11px;color:var(--muted)}.mb-board strong{font:800 30px system-ui;color:var(--accent-ink)}
.mb-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:110px}.mb-dots i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--accent) 55%);display:block}
.mb-fist{font-size:54px;line-height:1;animation:mbShake 1.6s ease-in-out infinite}.mb-fist.hide{animation:none}@keyframes mbShake{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
.mb-bets{display:flex;gap:7px;margin:10px 0 14px}.mb-bets button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);font-weight:700}.mb-bets button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mb-guess button{min-height:96px}.mb-guess button strong{font-size:30px}.mb-guess .hinted,.mi-q .hinted,.br-stone.hinted{outline:3px solid var(--accent-ink);outline-offset:2px}
.rl-field{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(#bfe9c8,#e9f7df);transition:background .15s}
[data-theme="dark"] .rl-field{background:linear-gradient(#1f4d33,#17331f)}
.rl-field[data-phase="warn"]{background:linear-gradient(#ffe8a8,#fff4d6)}[data-theme="dark"] .rl-field[data-phase="warn"]{background:linear-gradient(#5a4a14,#3a3010)}
.rl-field[data-phase="red"]{background:linear-gradient(#ffb3b8,#ffe1e3)}[data-theme="dark"] .rl-field[data-phase="red"]{background:linear-gradient(#6a1d24,#3d1117)}
.rl-field.hinted{box-shadow:inset 0 0 0 6px #ff3048}
.rl-tagger{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:46px}
.rl-chant{position:absolute;top:70px;left:0;right:0;text-align:center;font:800 16px system-ui;color:#1d2b22}[data-theme="dark"] .rl-chant{color:#f3f7f1}
.rl-finish{position:absolute;top:104px;left:8%;right:8%;border-top:3px dashed #ffffffb0;text-align:right;font:800 9px system-ui;letter-spacing:2px;color:#ffffffd0;padding-top:2px}
.rl-runner{position:absolute;left:50%;transform:translateX(-50%) scaleX(-1);font-size:34px;transition:bottom .05s linear}
.rl-progress{height:6px;background:var(--surface-3);border-radius:4px;margin:12px 0;overflow:hidden}.rl-progress span{display:block;height:100%;background:var(--accent)}
.rl-btn{width:100%;min-height:92px;border:0;border-radius:18px;background:var(--accent);color:#fff;font:800 18px system-ui;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.rl-btn.down{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}.rl-btn:disabled{opacity:.5}
.br-status{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.br-bridge{display:flex;flex-direction:column;gap:7px;padding:10px;border-radius:16px;background:linear-gradient(var(--accent-soft),var(--surface-2))}
.br-goal,.br-start{text-align:center;font:800 10px system-ui;letter-spacing:3px;color:var(--accent-ink);padding:4px}
.br-row{display:grid;grid-template-columns:22px 1fr 1fr 26px;gap:9px;align-items:center}.br-num{font-size:10px;color:var(--subtle);text-align:center}.br-me{font-size:20px}
.br-stone{display:grid;place-items:center;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:16px}
button.br-stone{height:52px;border-color:var(--accent);background:var(--surface);cursor:pointer}
.br-row.current{animation:none}.br-stone.safe{background:var(--accent);border-color:var(--accent)}.br-stone.dim{opacity:.35;border-style:dashed}
.br-stone.glow{background:#ffe066;border-color:#ffb800;box-shadow:0 0 18px #ffd23f}.br-stone.broken{background:transparent;border-style:dashed;opacity:.6}
.mi-players{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:6px 0 12px}
.mi-p{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}.mi-p span{font-size:20px}.mi-p b{font-size:13px;flex:1}.mi-p small{font:800 11px system-ui;color:var(--muted)}
.mi-p.me{border-color:var(--accent);background:var(--accent-soft)}.mi-p.won{border-color:var(--accent-ink)}.mi-p.won small{color:var(--accent-ink)}
.mi-hist{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);margin-bottom:14px}.mi-hist span{padding:3px 7px;border-radius:6px;background:var(--surface-2)}.mi-hist span.w{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}.mi-hist em{font-style:normal}
.mi-q{display:flex;align-items:center;gap:8px}.mi-q>span{font:800 12px system-ui;color:var(--subtle)}.mi-q .choice-btn{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.mi-q .choice-btn small{font-size:10px;opacity:.7}
.mi-last{margin:0 0 10px}
.filters{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.filters::-webkit-scrollbar{display:none}.filters button{flex:0 0 auto;white-space:nowrap}
/* 실시간 대결 */
.live-cta{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 10px;padding:15px 16px;border:0;border-radius:18px;text-align:left;color:#fff;background:linear-gradient(120deg,#5b5bff,#b44dff 55%,#ff5e9c);box-shadow:0 10px 26px -12px #8a4dff}
.live-cta strong{display:block;font-size:15px}.live-cta small{display:block;font-size:11.5px;opacity:.88;margin-top:2px}.live-cta>span:nth-child(2){flex:1}
.live-bolt{font-size:26px;animation:liveBolt 1.8s ease-in-out infinite}.live-go{font-size:18px;opacity:.9}
@keyframes liveBolt{0%,100%{transform:scale(1)}50%{transform:scale(1.15) rotate(-8deg)}}
.mode-card.live-mode{border-color:#9b5cff}.mode-card.live-mode .mode-icon{background:linear-gradient(120deg,#5b5bff,#b44dff);color:#fff}
.live-entry,.live-empty,.live-room,.live-countdown{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow)}
.live-entry h1{font-size:26px;line-height:1.25;margin:6px 0 8px}.live-entry p{color:var(--muted);font-size:13px;margin:0 0 16px}
.live-entry .btn.primary{margin-top:6px}
.live-join{display:flex;gap:8px;margin-top:10px}.live-join input{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:800 20px system-ui;letter-spacing:6px;text-align:center;text-transform:uppercase}
.live-join .btn{min-width:84px}
.live-empty{text-align:center}.live-empty h2{font-size:18px;margin:8px 0}.live-empty p{color:var(--muted);font-size:13px;margin:0 0 16px}
.live-big{font-size:46px}.live-big.spin{animation:spin 1.4s linear infinite;display:inline-block;color:var(--accent)}@keyframes spin{to{transform:rotate(360deg)}}
.live-code-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.live-code{display:block;font:900 34px/1.1 system-ui;letter-spacing:7px;color:var(--accent-ink)}
.live-warn{font-size:12px;color:var(--bad);margin:0 0 10px}
.live-players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.live-p{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);min-width:0}
.live-p b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.live-p em{font-style:normal;font-size:11px;color:var(--muted)}
.live-p.ready{border-color:#33c37a}.live-p.ready em{color:#22a866;font-weight:700}.live-p.me{box-shadow:inset 0 0 0 1px var(--accent)}
.live-p.empty{border-style:dashed;opacity:.65}.lp-av{font-size:20px}
.live-games{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:260px;overflow-y:auto;margin:8px 0 10px;padding:2px}
.live-games button{display:flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:700;text-align:left}
.live-games button span{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:13px}
.live-games button.active{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.live-levels{display:flex;gap:6px;margin-bottom:14px}.live-levels button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);font-weight:700;font-size:13px}.live-levels button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.live-picked{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--g);margin:8px 0 14px}.live-picked>span{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:20px}.live-picked small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.live-ready{margin-top:2px}
.live-emojis{display:flex;justify-content:space-between;gap:6px;margin:16px 0 10px}.live-emojis button{flex:1;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:20px}
.live-emojis button:active{transform:scale(.92)}
.live-result{padding:14px;border-radius:16px;background:var(--accent-soft);margin-bottom:14px}.live-result h2{font-size:18px;margin:4px 0 10px}
.live-result ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.live-result li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface)}.live-result li span{font:900 15px system-ui;color:var(--accent-ink);width:18px}.live-result li b{flex:1;font-size:13px}.live-result li em{font-style:normal;font-weight:800}.live-result li i{font-style:normal;font-size:10.5px;color:var(--muted)}
.live-result li.me{box-shadow:inset 0 0 0 2px var(--accent)}
.live-countdown{text-align:center;padding:34px 18px}.live-countdown h2{font-size:20px;margin:8px 0}.live-countdown p{color:var(--muted);font-size:13px}
.live-count{font:900 96px/1 system-ui;color:var(--accent);margin:18px 0;animation:livePulse 1s ease-in-out infinite}@keyframes livePulse{0%{transform:scale(1.15)}100%{transform:scale(.95)}}
.live-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 12px}.live-bar::-webkit-scrollbar{display:none}
.lb-p{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.lb-p b{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-p em{font-style:normal;font-weight:800;color:var(--accent-ink)}.lb-p i{font-style:normal;font-size:10px;color:#22a866;font-weight:700}
.lb-p.me{border-color:var(--accent)}.lb-p.off{opacity:.45}
/* 실시간 채팅 */
.chat-dock{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
.chat-dock>*{pointer-events:auto}
.chat-fab{position:relative;width:54px;height:54px;border-radius:50%;border:0;font-size:24px;background:linear-gradient(135deg,#5b5bff,#b44dff);color:#fff;box-shadow:0 8px 22px -8px #6b4dff}
.chat-badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b5c;color:#fff;font:800 11px/20px system-ui;text-align:center}
.chat-badge[hidden]{display:none}
.chat-peek{max-width:240px;margin-bottom:8px;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;color:var(--text);opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-peek.show{opacity:1;transform:none}
.chat-panel{display:none;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;height:min(44vh,400px);flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px -12px #0008;overflow:hidden}
.chat-dock.open .chat-panel{display:flex}.chat-dock.open .chat-fab,.chat-dock.open .chat-peek{display:none}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.chat-head small{flex:1;color:var(--muted);font-size:11px;letter-spacing:1px}
.chat-head button{border:0;background:var(--surface-2);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:14px}
.chat-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}
.cm{max-width:82%;align-self:flex-start;display:flex;flex-direction:column;gap:2px}.cm b{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.cm b button{border:0;background:none;padding:0 2px;font-size:10px;opacity:.55}
.cm span{padding:7px 11px;border-radius:4px 14px 14px 14px;background:var(--surface-2);font-size:13.5px;line-height:1.4;word-break:break-word}
.cm.me{align-self:flex-end;align-items:flex-end}.cm.me span{background:var(--accent);color:#fff;border-radius:14px 4px 14px 14px}
.cm.sys{align-self:center;max-width:94%;font-size:11.5px;color:var(--muted);text-align:center;background:var(--accent-soft);padding:5px 10px;border-radius:10px}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button,.fh-answers button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}
.chat-form{display:flex;gap:6px;padding:6px 12px 4px}.chat-form input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:0 12px;font-size:15px}
.chat-form button{border:0;border-radius:12px;padding:0 16px;background:var(--accent);color:#fff;font-weight:800}
.chat-note{margin:0;padding:2px 12px 10px;font-size:10.5px;color:var(--subtle)}
/* 내 단어 맞히기 */
.live-games button.party{grid-column:1/-1;flex-wrap:wrap;background:linear-gradient(120deg,color-mix(in srgb,#b569ff 22%,var(--surface-2)),var(--surface-2))}
.live-games button.party em{margin-left:auto;font-style:normal;font-size:10px;color:#b569ff;font-weight:800}
.fh{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.fh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.fh-time{font:800 18px system-ui;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.fh-me{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--accent-soft);margin-bottom:12px}
.fh-me b{font-size:15px}.fh-me p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.fh-card{flex:0 0 auto;min-width:74px;height:74px;padding:0 10px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:2px dashed var(--accent);font:900 30px system-ui;color:var(--accent-ink)}
.fh-me.solved .fh-card{border-style:solid;font-size:18px}
.fh-others{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.fh-other{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.fh-other strong{font-size:22px;color:var(--text)}.fh-name{font-size:11px;color:var(--muted)}.fh-other small{font-size:11px;color:var(--muted)}
.fh-other.solved{border-color:#33c37a}.fh-other.solved small{color:#22a866;font-weight:700}.fh-other.off{opacity:.45}
.fh-guess{display:flex;gap:6px}.fh-guess input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:0 12px;font-size:16px}
.fh-guess button{min-width:96px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}.fh-guess button:disabled{opacity:.5}
.fh-answers{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.fh-reveal{font-weight:600;color:var(--accent-ink);font-size:11px;margin-left:4px}
/* 홈 히어로: 특정 게임이 아닌 '아레나' 전체를 대표 */
.arena-hero{min-height:0;padding-bottom:16px}
.arena-hero .hero-copy{max-width:62%}
.arena-hero .hero-copy h1{font-size:clamp(26px,7.4vw,38px);line-height:1.18}
.arena-hero .hero-copy p{font-size:12.5px;line-height:1.55}
.hero-mosaic{position:absolute;right:-18px;top:62px;display:grid;grid-template-columns:repeat(3,44px);gap:7px;transform:rotate(-12deg);z-index:1;pointer-events:none}
.hero-mosaic .mt{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:19px;font-weight:900;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--g) 80%,#000),inset 0 -3px 0 #0000002a;animation:mtFloat 4.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.55s)}
.hero-mosaic .mt:nth-child(5){transform:scale(1.12);outline:2px solid #ffffffb0;outline-offset:2px}
@keyframes mtFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}
.arena-hero .hero-actions{position:relative;z-index:3;display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.arena-hero .hero-cta{width:auto;flex:1 1 auto;min-width:0;font-size:13px;padding:13px 14px;background:linear-gradient(120deg,#5b5bff,#b44dff 60%,#ff5e9c);color:#fff;box-shadow:0 10px 24px -12px #8a4dff}
.hero-ghost{flex:0 0 auto;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--text);border-radius:10px;padding:0 14px;min-height:45px;font-size:12.5px;font-weight:800;backdrop-filter:blur(6px)}
.arena-hero .hero-bottom{font-size:9px;margin-top:16px}
.arena-hero .hero-bottom span:last-child{color:#33d17a;font-weight:800}
@media(max-width:365px){.arena-hero .hero-copy{max-width:66%}.hero-mosaic{transform:rotate(-12deg) scale(.82);right:-30px;top:58px}.arena-hero .hero-cta{font-size:12px}}
@media(min-width:480px){.hero-mosaic{right:16px;top:50px;transform:rotate(-10deg) scale(1.12)}}
@media(min-width:900px){.hero-mosaic{right:70px;top:46px;transform:rotate(-10deg) scale(1.5)}.arena-hero .hero-actions{max-width:420px}}
@media(prefers-reduced-motion:reduce){.hero-mosaic .mt{animation:none}}
.today-card{display:flex;align-items:center;gap:13px;width:100%;margin:12px 0 0;padding:13px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--g) 45%,var(--line));background:linear-gradient(110deg,color-mix(in srgb,var(--g) 16%,var(--surface)),var(--surface) 70%);color:var(--text);text-align:left}
.today-art{flex:0 0 46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:21px;font-weight:900}
.today-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.today-copy small{font-size:9.5px;letter-spacing:.8px;color:var(--g-ink);font-weight:800}
[data-theme="dark"] .today-copy small{color:var(--g)}
.today-copy strong{font-size:15px}.today-copy em{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-go svg{width:16px;height:16px;color:var(--subtle)}
.quick-modes{margin-top:10px}
.quick-modes button{font-size:20px;color:var(--text)}
.quick-modes strong{font-size:12.5px}.quick-modes small{font-size:10.5px;line-height:1.35}

.brand-mark{border:0!important;padding:0;background:none}.brand-mark svg{filter:drop-shadow(0 4px 8px #7a3dff55)}
.hero-mosaic{grid-template-columns:repeat(3,38px);gap:6px;top:56px;right:-14px}
.hero-mosaic .mt{width:38px;height:38px;border-radius:11px;font-size:16px}
.arena-hero .hero-actions{margin-top:28px}
.arena-hero .hero-actions{flex-wrap:nowrap;align-items:center}.hero-ghost{min-height:45px;height:45px}
@media(max-width:365px){.hero-ghost{padding:0 10px;font-size:11.5px}.arena-hero .hero-cta{padding:12px 11px;gap:8px}}

/* 톤 다운: 버튼은 단색 포인트, 색은 게임 타일에만 */
.arena-hero .hero-cta{background:var(--accent);color:var(--accent-text);box-shadow:none}
[data-theme="dark"] .arena-hero .hero-cta{background:#e8ecf6;color:#0d1530}
.arena-hero .hero-bottom span:last-child{color:var(--hero-muted)}
.arena-hero .hero-bottom span:last-child::first-letter{color:#33d17a}
.chat-fab{background:var(--accent);box-shadow:0 8px 22px -10px #000a}
[data-theme="dark"] .chat-fab{background:#e8ecf6;color:#0d1530}
.mode-card.live-mode{border-color:var(--line)}.mode-card.live-mode .mode-icon{background:var(--surface-2);color:var(--accent-ink)}
.live-games button.party{background:var(--surface-2)}.live-games button.party em{color:var(--accent-ink)}
.chat-form button,.fh-guess button{background:var(--accent)}
.cm.me span{background:var(--accent)}
/* 1위 뽑기 시리즈 */
.live-modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
.live-modes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);text-align:left}
.live-modes button:first-child{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}
.live-modes b{font-size:13px}.live-modes small{font-size:10.5px;color:var(--muted)}
.live-modes button.active{border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.series{padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);margin:0 0 14px}
.series.done{border-color:#e8b931;background:color-mix(in srgb,#e8b931 10%,var(--surface-2))}
.series-head{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}.series-head b{font-size:15px}
.series-desc{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.series-table{width:100%;border-collapse:collapse;font-size:12.5px}.series-table th{font-size:10px;color:var(--subtle);font-weight:700;text-align:left;padding:4px 6px}
.series-table td{padding:7px 6px;border-top:1px solid var(--line)}.series-table td:first-child,.series-table th:first-child{width:22px;color:var(--muted)}
.series-table td:nth-child(3),.series-table td:nth-child(4),.series-table th:nth-child(3),.series-table th:nth-child(4){text-align:right;width:44px}
.series-table tr.me td{color:var(--accent-ink);font-weight:700}.series-table tr.champ td:nth-child(2)::after{content:' 🏆'}
.series-chips{display:flex;flex-wrap:wrap;gap:6px}.series-chips span{padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.series-chips span.out{opacity:.45;text-decoration:line-through}.series-chips span.me{border-color:var(--accent-ink)}.series-chips span.champ{border-color:#e8b931}
.bracket{display:flex;gap:10px;overflow-x:auto}.br-stage{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:140px;flex:1}
.br-match{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}.br-match small{display:block;font-size:9.5px;color:var(--subtle);padding:4px 8px 0;font-weight:700}
.br-match div{display:flex;justify-content:space-between;padding:6px 8px;font-size:12.5px}.br-match div+div{border-top:1px solid var(--line)}
.br-match .win{font-weight:800;color:var(--accent-ink)}.br-match .lose{opacity:.45}.br-match .bye{opacity:.5;font-style:italic}.br-match .me span::after{content:' (나)';font-size:10px;color:var(--muted)}
.br-match em{font-style:normal}
.arena-hero .hero-cta{margin-top:0}
.series-stop{margin-top:10px;border:0;background:none;color:var(--muted);font-size:11.5px;text-decoration:underline;padding:4px 0}
.bracket{flex-direction:column}.br-stage{flex-direction:row;min-width:0}.br-match{flex:1;min-width:0}.br-match span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 징검다리 3칸 */
.br-row.w3{grid-template-columns:22px 1fr 1fr 1fr 26px;gap:7px}
/* 파티 게임 */
.party-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 26px}
.party-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:13px 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-align:left;min-width:0}
.party-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:17px;margin-bottom:4px}
.party-card strong{font-size:13.5px}.party-card small{font-size:10.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.party-card em{font-style:normal;font-size:9.5px;font-weight:800;color:var(--subtle);letter-spacing:.3px;margin-top:2px}
.live-modes.topic button:first-child{grid-column:auto;flex-direction:column;align-items:flex-start}
.live-modes button:disabled{opacity:.6}
.party-rule{margin:6px 0 4px}
.fh-time.urgent{color:#ff5468}
.fh-me.liar{background:color-mix(in srgb,#ff4d5e 14%,var(--surface-2))}
.fh-card.liar-word{font-size:17px;border-style:solid;padding:0 12px}
.liar-hints{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;max-height:220px;overflow-y:auto}
.liar-hints div{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}.liar-hints b{flex:0 0 auto;font-size:11px;color:var(--muted)}
.liar-hints em{font-style:normal;font-size:12px;color:var(--muted)}
.liar-vote{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 14px}
.liar-vote button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:800}
.liar-vote button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.liar-reveal{margin:4px 0 6px;font-size:12.5px;color:var(--muted)}.liar-reveal b{color:var(--text)}
.nc-next{text-align:center;margin:6px 0}.nc-next small{display:block;font-size:11px;color:var(--muted)}.nc-next strong{font:900 64px/1.1 system-ui;color:var(--accent-ink)}
.nc-btn{width:100%;min-height:110px;border:0;border-radius:22px;background:var(--accent);color:var(--accent-text);font:900 34px system-ui;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000);margin:6px 0 14px;touch-action:manipulation}
[data-theme="dark"] .nc-btn{background:#e8ecf6;color:#0d1530;box-shadow:0 6px 0 #9aa3bd}
.nc-btn:active,.nc-btn.pressed{transform:translateY(4px);box-shadow:0 2px 0 #0004}
.nc-btn.safe{background:#2fb46b;color:#fff;box-shadow:none}.nc-btn.out{background:#d83a4a;color:#fff;box-shadow:none}.nc-btn.pend{opacity:.7}
.nc-players{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.nc-players span{padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:700}
.nc-players span.safe{border-color:#2fb46b}.nc-players span.out{opacity:.5;text-decoration:line-through}.nc-players b{color:var(--accent-ink);margin-left:3px}
.nc-log{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.nc-log span{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--surface-2)}.nc-log span.bad{color:#ff5468}
.vt-reveal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.vt-reveal div{padding:14px;border-radius:14px;background:var(--surface-2);text-align:center;border:1px solid var(--line)}
.vt-reveal div.win{border-color:#2fb46b;box-shadow:inset 0 0 0 1px #2fb46b}.vt-reveal b{display:block;font-size:13px}.vt-reveal strong{font:900 34px system-ui}
.fh.vote .mi-q{margin:8px 0 6px}
/* 스도쿠 */
.sd-grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--text);border-radius:8px;overflow:hidden;aspect-ratio:1;max-width:380px;margin:0 auto 12px;background:var(--surface)}
.sd-grid button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);color:var(--accent-ink);font:700 clamp(15px,4.6vw,20px) system-ui;padding:0;min-width:0;aspect-ratio:1}
.sd-grid button:nth-child(9n){border-right:0}.sd-grid button:nth-child(9n+3),.sd-grid button:nth-child(9n+6){border-right:2px solid var(--text)}
.sd-grid button:nth-child(n+19):nth-child(-n+27),.sd-grid button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--text)}
.sd-grid button.given{color:var(--text);font-weight:900}.sd-grid button.peer{background:var(--surface-2)}.sd-grid button.same{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.sd-grid button.sel{background:color-mix(in srgb,var(--accent) 40%,var(--surface));outline:2px solid var(--accent);outline-offset:-2px}
.sd-grid button.bad{animation:sdBad .5s}.sd-grid button.hinted{box-shadow:inset 0 0 0 3px #f5c21b}
@keyframes sdBad{0%,100%{background:var(--surface)}30%{background:#ff4d5e66}}
.sd-pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:380px;margin:0 auto 6px}.sd-pad button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);font:800 18px system-ui;padding:0}
.sd-pad button:disabled{opacity:.25}.sd-pad button.hinted{outline:2px solid #f5c21b}
/* 숫자 합치기 */
.mg-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-radius:16px;background:var(--surface-3);max-width:340px;margin:0 auto 12px;touch-action:none;aspect-ratio:1}
.mg-t{display:grid;place-items:center;border-radius:10px;background:var(--surface-2);font:900 clamp(18px,6vw,28px) system-ui;color:var(--text)}
.mg-t.v2{background:#e9edf5;color:#3b4560}.mg-t.v4{background:#dfe6f7;color:#2d3a5c}.mg-t.v8{background:#ffc580;color:#fff}.mg-t.v16{background:#ffa25e;color:#fff}.mg-t.v32{background:#ff7d5e;color:#fff}.mg-t.v64{background:#ff5a4a;color:#fff}
.mg-t.v128,.mg-t.v256,.mg-t.v512{background:#f5c21b;color:#fff;font-size:clamp(16px,5vw,24px)}.mg-t.v1024,.mg-t.v2048,.mg-t.v4096{background:#8a5cff;color:#fff;font-size:clamp(14px,4.4vw,20px)}
.mg-pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:6px;justify-content:center}
.mg-pad button{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-size:20px}
.mg-pad .d-up{grid-area:u}.mg-pad .d-left{grid-area:l}.mg-pad .d-down{grid-area:d}.mg-pad .d-right{grid-area:r}.mg-pad button.hinted{outline:2px solid var(--accent-ink)}

const FLIP_LIMIT = 6;

function createBlind(seed,difficulty='normal') {

// ==== src/games/baseball.js ====
// 숫자 탐정 — classic "bulls and cows" (숫자 야구). Find the hidden 3-digit code (1-9, no repeats).

const BB_LEN = 3, BB_TRIES = 8;
const DIGITS = [1,2,3,4,5,6,7,8,9];
function createBaseball(seed, difficulty='normal') {
  const r = seededRandom(`baseball:${seed}`);
  const secret = shuffle(DIGITS, r).slice(0, BB_LEN);
  return {seed, difficulty, secret, turn:0, history:[], score:0, cpuScore:0, solved:false, over:false, last:null};
}
function judge(secret, guess) {
  let strike = 0, ball = 0;
  guess.forEach((d, i) => { if (secret[i] === d) strike++; else if (secret.includes(d)) ball++; });
  return {strike, ball};
}
function validGuess(guess) { return Array.isArray(guess) && guess.length === BB_LEN && new Set(guess).size === BB_LEN && guess.every(d => DIGITS.includes(d)); }
const scoreFor = (tries) => Math.max(10, 110 - tries * 10); // solved in 1 try = 100 ... 8 tries = 30
function playBaseball(g, guess) {
  if (g.over || !validGuess(guess)) return g;
  const res = judge(g.secret, guess), turn = g.turn + 1, solved = res.strike === BB_LEN;
  const over = solved || turn >= BB_TRIES;
  return {...g, turn, solved, over, history:[...g.history, {guess, ...res}], last:{guess, ...res}, score: solved ? scoreFor(turn) : 0};
}
const allCodes = (() => { const out = []; for (const a of DIGITS) for (const b of DIGITS) for (const c of DIGITS) if (a!==b && b!==c && a!==c) out.push([a,b,c]); return out; })();
function candidates(history) { return allCodes.filter(code => history.every(h => { const j = judge(code, h.guess); return j.strike === h.strike && j.ball === h.ball; })); }
function baseballAdvice(g) {
  const c = candidates(g.history);
  const pick = c[seededRandom(`bbhint:${g.seed}:${g.turn}`)() * c.length | 0] || [1,2,3];
  return {guess: pick, note: `가능한 정답이 ${c.length}개 남았어요. ${pick.join('')} 을(를) 시도해 보세요.`};
}
// AI opponent solves its own hidden code from the same seed; its result becomes the target score.
function baseballBotTarget(seed, difficulty='normal') {
  const r = seededRandom(`bbbot:${seed}:${difficulty}`);
  const secret = shuffle(DIGITS, seededRandom(`baseball-ai:${seed}`)).slice(0, BB_LEN);
  const sloppy = byLevel(difficulty, [.3, .15, .05, 0, 0]), smart = byLevel(difficulty, [0, 0, 0, 0.6, 1]);
  const history = [];
  for (let t = 1; t <= BB_TRIES; t++) {
    const pool = r() < sloppy ? allCodes : candidates(history);
    let guess = pool[r() * pool.length | 0];
    if (pool.length > 2 && r() < smart) { // pick the guess that splits the remaining candidates best
      let best = Infinity;
      for (const g of pool.slice(0, 40)) { const parts = {}; for (const c of pool) { const j = judge(c, g); const k = `${j.strike}${j.ball}`; parts[k] = (parts[k] || 0) + 1; } const worst = Math.max(...Object.values(parts)); if (worst < best) { best = worst; guess = g; } }
    }
    const j = judge(secret, guess); history.push({guess, ...j});
    if (j.strike === BB_LEN) return scoreFor(t);
  }
  return 0;
}


// ==== src/games/nim.js ====
// 마지막 한 개 — classic misère Nim (take 1~3; whoever takes the LAST stone loses). Best of 3 rounds vs AI.

const NIM_ROUNDS = 3, NIM_WIN = 30;
// 13~22 stones, never 4k+1: the player (who moves first) can always win with perfect play — pure skill, no bad luck.
function roundStart(seed, round) { const r = seededRandom(`nim:${seed}:${round}`); let n = 13 + (r() * 10 | 0); if ((n - 1) % 4 === 0) n += 1 + (r() * 3 | 0); return n; }
function createNim(seed, difficulty='normal') {
  return {seed, difficulty, round:0, stones:roundStart(seed, 0), turn:0, score:0, cpuScore:0, wins:0, losses:0, over:false, last:null, log:[]};
}
function nimCpuTake(g) {
  const r = seededRandom(`nimcpu:${g.seed}:${g.round}:${g.stones}:${g.turn}`);
  const perfect = (g.stones - 1) % 4; // leave 4k+1 stones for the opponent
  const skill = byLevel(g.difficulty, [.7, .82, .9, .96, 1]);
  if (perfect > 0 && r() < skill) return perfect;
  return Math.max(1, Math.min(3, g.stones, 1 + (r() * 3 | 0)));
}
function endRound(g, loser, log) {
  const wins = g.wins + (loser === 'cpu' ? 1 : 0), losses = g.losses + (loser === 'me' ? 1 : 0), round = g.round + 1;
  const over = round >= NIM_ROUNDS || wins >= 2 || losses >= 2;
  return {...g, wins, losses, round, score: wins * NIM_WIN, cpuScore: losses * NIM_WIN, over, stones: over ? 0 : roundStart(g.seed, round),
    last:{...log, roundEnd: loser === 'cpu' ? 'win' : 'lose'}, log:[]};
}
function playNim(g, take) {
  if (g.over || ![1,2,3].includes(take) || take > g.stones) return g;
  let stones = g.stones - take, turn = g.turn + 1;
  const log = {mine: take, cpu: null};
  if (stones === 0) return endRound({...g, turn}, 'me', log); // I took the last stone -> I lose the round
  const cpu = nimCpuTake({...g, stones, turn});
  stones -= cpu; log.cpu = cpu;
  if (stones === 0) return endRound({...g, turn}, 'cpu', log);
  return {...g, stones, turn, last: log, log:[...g.log, log]};
}
function nimAdvice(g) {
  const best = (g.stones - 1) % 4;
  return best > 0 ? {take: best, note: `${best}개를 가져가 상대에게 ${g.stones - best}개(4의 배수+1)를 남기세요.`}
                  : {take: 1, note: '지금은 불리한 자리예요. 1개만 가져가고 상대의 실수를 기다리세요.'};
}


// ==== src/games/auction.js ====
// 칩 경매 — sealed-bid auction psychology. 5 items, 30 coins each; higher secret bid wins the item.

const AUC_ROUNDS = 5, AUC_COINS = 30;
const ITEMS = [{name:'금화', icon:'🪙', value:8},{name:'보석', icon:'💎', value:10},{name:'왕관', icon:'👑', value:12},{name:'열쇠', icon:'🗝️', value:6},
  {name:'두루마리', icon:'📜', value:4},{name:'저주받은 상자', icon:'🧨', value:-5},{name:'트로피', icon:'🏆', value:9},{name:'나침반', icon:'🧭', value:5}];
function createAuction(seed, difficulty='normal') {
  const r = seededRandom(`auction:${seed}`);
  const lots = shuffle(ITEMS, r).slice(0, AUC_ROUNDS);
  return {seed, difficulty, lots, turn:0, coins:AUC_COINS, cpuCoins:AUC_COINS, score:0, cpuScore:0, myItems:[], cpuItems:[], over:false, last:null};
}
function auctionCpuBid(g) {
  const lot = g.lots[g.turn], r = seededRandom(`auccpu:${g.seed}:${g.difficulty}:${g.turn}`);
  if (lot.value <= 0) return 0;
  const left = AUC_ROUNDS - g.turn, fair = g.cpuCoins / left;
  const greed = byLevel(g.difficulty, [1.15, 1.3, 1.45, 1.55, 1.65]);
  let bid = Math.round(fair * (lot.value / 8) * greed * (0.7 + r() * 0.6));
  // 고수+: knows how many coins you have left and outbids a likely all-in on the best lots
  if (lvl(g.difficulty) >= 3 && lot.value >= 10 && g.coins < g.cpuCoins) bid = Math.max(bid, Math.min(g.cpuCoins, g.coins + 1));
  return Math.max(0, Math.min(g.cpuCoins, bid));
}
function playAuction(g, bid) {
  bid = Math.trunc(Number(bid));
  if (g.over || !Number.isFinite(bid) || bid < 0 || bid > g.coins) return g;
  const lot = g.lots[g.turn], cpu = auctionCpuBid(g);
  const winner = bid > cpu ? 'me' : cpu > bid ? 'cpu' : 'none'; // tie: nobody gets it, both pay
  const coins = g.coins - bid, cpuCoins = g.cpuCoins - cpu, turn = g.turn + 1;
  const myItems = winner === 'me' ? [...g.myItems, lot] : g.myItems, cpuItems = winner === 'cpu' ? [...g.cpuItems, lot] : g.cpuItems;
  const pts = (items) => items.reduce((a, x) => a + x.value, 0) * 10;
  const over = turn >= AUC_ROUNDS;
  // Leftover coins are worth 1 point each at the end (spending everything isn't free).
  const score = pts(myItems) + (over ? coins : 0), cpuScore = pts(cpuItems) + (over ? cpuCoins : 0);
  return {...g, turn, coins, cpuCoins, myItems, cpuItems, score, cpuScore, over, last:{lot, mine:bid, cpu, winner}};
}
function auctionAdvice(g) {
  const lot = g.lots[g.turn], guess = auctionCpuBid(g);
  if (lot.value <= 0) return {bid:0, note:`${lot.name}은(는) ${lot.value * 10}점짜리 함정이에요. 0칩으로 넘기세요.`};
  // Paid hint gives a range, not the exact bid — keeps the mind game alive.
  const lo = Math.max(0, guess - 2 - (guess % 3)), hi = Math.min(g.cpuCoins, lo + 5);
  return {bid: Math.min(g.coins, hi + 1), note:`AI는 ${lo}~${hi}칩 사이를 걸 것 같아요. 남은 칩: AI ${g.cpuCoins}칩.`};
}


// ==== src/games/geometry.js ====
// Small geometry helpers shared by the drag games (pure functions, unit-tested).
function distToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
  let t = len2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}
function distToPolyline(p, pts, closed = false) {
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) best = Math.min(best, distToSegment(p, pts[i], pts[i + 1]));
  if (closed && pts.length > 2) best = Math.min(best, distToSegment(p, pts[pts.length - 1], pts[0]));
  return best;
}
function resample(pts, n) {
  if (pts.length < 2) return pts.slice();
  const seg = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); total += d; }
  if (!total) return [pts[0]];
  const out = []; let i = 0, acc = 0;
  for (let k = 0; k < n; k++) {
    const target = (total * k) / (n - 1);
    while (i < seg.length - 1 && acc + seg[i] < target) { acc += seg[i]; i++; }
    const t = seg[i] ? (target - acc) / seg[i] : 0;
    out.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]);
  }
  return out;
}
const toPath = (pts, closed = false) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ') + (closed ? ' Z' : '');


// ==== src/games/maze.js ====
// 닿지 마! — drag a dot through a winding corridor without touching the walls.
// 5 stages: every stage the corridor gets tighter and YOUR dot gets bigger. Difficulty sets how fast.


const MAZE_W = 300, MAZE_H = 420, MAZE_STAGES = 5;
// clear = free room for the dot's centre; dot = dot radius. Visual corridor half-width = clear + dot.
function mazeStageSize(difficulty, s) {
  const l = lvl(difficulty), base = [24, 20, 16.5, 13.5, 11][l];
  const clear = Math.max(4.5, base - s * [1.8, 2.2, 2.5, 2.4, 1.6][l]), dot = 5 + s * [1.2, 1.6, 2.1, 2.6, 3.1][l];
  return {clear: Math.round(clear * 10) / 10, dot: Math.round(dot * 10) / 10, half: Math.round((clear + dot) * 10) / 10};
}
function makePath(seed, stage) {
  const r = seededRandom(`maze:${seed}:${stage}`), rows = 5 + Math.min(stage, 4), pts = [[52, 42]];
  for (let i = 1; i <= rows; i++) {
    const y = 30 + (360 * i) / rows;
    const x = i % 2 ? 210 + r() * 50 : 40 + r() * 50;      // zig-zag left/right
    pts.push([x, y - 360 / rows / 2 + r() * 10]); pts.push([x, y]);
  }
  return pts;
}
function createMaze(seed, difficulty = 'normal') {
  const stages = Array.from({length: MAZE_STAGES}, (_, s) => ({points: makePath(seed, s), ...mazeStageSize(difficulty, s)}));
  return {seed, difficulty, stages, turn: 0, score: 0, cpuScore: 0, results: [], over: false, last: null};
}
function insideCorridor(stage, p) { return distToPolyline(p, stage.points) <= (stage.clear ?? stage.half); }
// Judge a whole drag. trace = [[x,y,ms],...] in board coordinates.
function judgeTrace(stage, trace) {
  if (!trace.length) return {ok: false, reason: 'empty', progress: 0};
  const start = stage.points[0], goal = stage.points.at(-1);
  if (Math.hypot(trace[0][0] - start[0], trace[0][1] - start[1]) > stage.half + 10) return {ok: false, reason: 'start', progress: 0};
  for (let i = 0; i < trace.length; i++) {
    if (!insideCorridor(stage, trace[i])) return {ok: false, reason: 'touch', progress: i / trace.length, at: trace[i]};
    if (Math.hypot(trace[i][0] - goal[0], trace[i][1] - goal[1]) <= stage.half) return {ok: true, ms: Math.max(0, trace[i][2] - trace[0][2])};
  }
  return {ok: false, reason: 'lift', progress: 1};
}
const stagePoints = (res) => res.ok ? 40 + Math.max(0, Math.round(20 - res.ms / 750)) : 0; // 40 + up to 20 speed bonus
function playMaze(g, trace) {
  if (g.over) return g;
  const res = judgeTrace(g.stages[g.turn], trace), pts = stagePoints(res), turn = g.turn + 1;
  return {...g, turn, score: g.score + pts, results: [...g.results, {...res, pts}], last: {...res, pts}, over: turn >= MAZE_STAGES};
}
function mazeBotTarget(seed, difficulty = 'normal') {
  const r = seededRandom(`mazebot:${seed}:${difficulty}`);
  return byLevel(difficulty, [150, 185, 215, 240, 262]) + Math.round(r() * 18);
}
const mazeAdvice = (g) => ({note: `${g.turn + 1}단계: 여유 폭 ${Math.round(g.stages[g.turn].clear * 2)}px, 내 점 지름 ${Math.round(g.stages[g.turn].dot * 2)}px. 가운데 점선만 따라가세요!`, guide: true});


// ==== src/games/draw.js ====
// 그대로 그리기 — draw the outline in one stroke. 5 rounds, each shape harder and judged stricter.


const DRAW_SIZE = 300, DRAW_ROUNDS = 5;
const C = 150, R = 105;
const SHAPES = {

const TIERS = [['circle', 'triangle'], ['heart', 'chip'], ['star', 'bolt']];

  const r = seededRandom(`draw:${seed}`), t = TIERS.map((x) => shuffle(x, r));

  const r = seededRandom(`drawbot:${seed}:${difficulty}`);

// Client for the real-time room server (live-server/). Keeps one WebSocket open, reconnects on drops,
// and keeps the server clock offset so every player's countdown ends at the same moment.

const liveAvailable = () => !!LIVE_URL;
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
const newRoomCode = () => Array.from({length: 4}, () => CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0]).join('');
const normalizeCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

function connectLive({code, name, pid, onState, onEmoji, onChat, onChatLog, onStatus, onError}) {
  let ws = null, closedByUser = false, tries = 0, offset = 0, timer = null, ping = null;
  const open = () => {
    onStatus?.(tries ? 'reconnecting' : 'connecting');
    try { ws = new WebSocket(`${LIVE_URL}/${code}?pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(name)}`); }
    catch { onError?.('connect'); return; }
    ws.onopen = () => { tries = 0; onStatus?.('open'); clearInterval(ping); ping = setInterval(() => send({t: 'ping'}), 20000); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.serverNow) offset = m.serverNow - Date.now();
      if (m.t === 'state') onState?.(m);
      else if (m.t === 'emoji') onEmoji?.(m);
      else if (m.t === 'chat') onChat?.(m);
      else if (m.t === 'chatlog') onChatLog?.(m.items || []);
      else if (m.t === 'error') { closedByUser = true; onError?.(m.code); }
    };
    ws.onclose = () => {
      clearInterval(ping);
      if (closedByUser) { onStatus?.('closed'); return; }
      if (tries >= 6) { onStatus?.('closed'); onError?.('lost'); return; }
      tries += 1; onStatus?.('reconnecting');
      timer = setTimeout(open, Math.min(8000, 600 * 2 ** tries));
    };
  };
  const send = (msg) => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); return true; } return false; };
  open();
  return {
    send,
    serverNow: () => Date.now() + offset,
    close() { closedByUser = true; clearTimeout(timer); clearInterval(ping); try { ws?.close(1000, 'bye'); } catch {} },
  };
}

    sdk.graniteEvent.addEventListener('backEvent', {
      onEvent: () => { onBack(); },
      onError: (e) => console.warn('backEvent', e),
    });
  } catch (e) { console.warn('backEvent subscribe failed', e); }
}
async function exitApp() {
  const sdk = await getSDK();

/* ---------- Boot: environment, safe area, user key, ad preload ---------- */
async function initToss() {
  const sdk = await getSDK();
  if (!sdk) return tossState;
  try {
    const insets = sdk.SafeAreaInsets?.get?.();
    if (insets) {
      tossState.inToss = true;
      document.documentElement.classList.add('in-toss');
      applyInsets(insets);
      sdk.SafeAreaInsets.subscribe?.({onEvent: applyInsets});
    }
  } catch (_) { /* not inside the Toss app */ }
  if (!tossState.inToss) return tossState;
  try {
    const res = await withTimeout(sdk.User.getAnonymousKey(), 5000);
    if (res?.hash) tossState.userKeyHash = String(res.hash);
  } catch (e) { console.warn('사용자 식별키를 가져오지 못했어요(기기 저장으로 계속):', e); }
  preloadRewardedAd();
  return tossState;
}

/* ---------- Rewarded ad: integrated in-app ads (loadFullScreenAd -> showFullScreenAd -> reload) ---------- */
let loadCleanup = null, loadRetries = 0, loadWaiters = [];
function settleLoad(ok) { const w = loadWaiters; loadWaiters = []; w.forEach(fn => fn(ok)); }
async function preloadRewardedAd() {
  if (!TOSS_CONFIG.enableRewardedAds || !TOSS_CONFIG.rewardedAdGroupId || tossState.adReady || loadCleanup) return;
  const sdk = await getSDK();
  const load = sdk?.loadFullScreenAd;
  try { if (!load || (load.isSupported && !load.isSupported())) return; } catch (_) { return; }
  try {
    loadCleanup = load({
      options: {adGroupId: TOSS_CONFIG.rewardedAdGroupId},
      onEvent: (e) => {
        if (e?.type === 'loaded') { tossState.adReady = true; loadRetries = 0; try { loadCleanup?.(); } catch (_) {} loadCleanup = null; settleLoad(true); }
      },
      onError: (err) => {
        console.warn('광고 로드 실패', err);
        try { loadCleanup?.(); } catch (_) {} loadCleanup = null; settleLoad(false);
        if (loadRetries < 3) { loadRetries += 1; setTimeout(preloadRewardedAd, 20000 * loadRetries); } // bounded retries
      },
    });
  } catch (err) { loadCleanup = null; settleLoad(false); }
}
function isRewardedAdSupported() { return tossState.inToss && Boolean(TOSS_CONFIG.rewardedAdGroupId); }

async function showRewardedAd() {
  if (!TOSS_CONFIG.enableRewardedAds || !TOSS_CONFIG.rewardedAdGroupId) throw new Error('광고를 준비 중이에요. 잠시 후 다시 시도해 주세요.');
  if (!tossState.inToss) throw new Error('광고는 토스 앱에서만 볼 수 있어요.');
  const sdk = await getSDK();
  const show = sdk?.showFullScreenAd;
  if (!show || (show.isSupported && !show.isSupported())) throw new Error('토스 앱을 최신 버전으로 업데이트하면 광고를 볼 수 있어요.');
  if (!tossState.adReady) {
    const ok = await new Promise((resolve) => { loadWaiters.push(resolve); void preloadRewardedAd(); setTimeout(() => resolve(false), 8000); });
    if (!ok || !tossState.adReady) throw new Error('지금은 볼 수 있는 광고가 없어요. 잠시 후 다시 시도해 주세요.');
  }
  tossState.adReady = false; // a shown ad can't be shown again
  return new Promise((resolve, reject) => {
    let rewarded = false, finished = false, cleanup = () => {};
    const done = (error) => {
      if (finished) return; finished = true;
      try { cleanup(); } catch (_) {}
      void preloadRewardedAd(); // load -> show -> load
      if (error) reject(error); else resolve(rewarded);
    };
    try {
      cleanup = show({
        options: {adGroupId: TOSS_CONFIG.rewardedAdGroupId},
        onEvent: (e) => {
          if (e?.type === 'userEarnedReward') rewarded = true; // the ONLY reward trigger
          if (e?.type === 'dismissed') done();
          if (e?.type === 'failedToShow') done(new Error('광고를 표시하지 못했어요.'));
        },
        onError: (e) => done(e instanceof Error ? e : new Error('광고 재생에 실패했어요.')),
      }) || (() => {});
    } catch (err) { done(err); }
  });
}

/* ---------- Share a challenge link ---------- */
async function shareInvite(search, text) {
  if (tossState.inToss && TOSS_CONFIG.appName) {
    try {
      const sdk = await getSDK();
      const path = `intoss://${TOSS_CONFIG.appName}?${search.toString()}`;
      const tossLink = await sdk.Share.createLink({path});
      await sdk.Share.sendMessage({message: `${text}\n${tossLink}`});
      return {ok: true, via: 'toss'};
    } catch (error) {
      if (/cancel/i.test(String(error?.message || error))) return {ok: false, error: '공유를 취소했어요.'};
      console.warn('토스 공유 실패:', error);
      return {ok: false, error: '공유하지 못했어요. 잠시 후 다시 시도해 주세요.'};
    }
  }
  if (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname)) {
    return {ok: false, error: '도전 링크는 토스 앱에서 공유할 수 있어요.'};
  }
  const url = new URL(location.href); url.search = search.toString(); url.hash = '';
  try {
    if (navigator.share) { await navigator.share({title: '두뇌게임 대결', text, url: String(url)}); return {ok: true, via: 'browser'}; }
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(`${text}\n${url}`); return {ok: true, via: 'clipboard'}; }
    return {ok: false, error: '공유 기능을 사용할 수 없어요.'};
  } catch (error) {
    return {ok: false, error: error?.name === 'AbortError' ? '공유를 취소했어요.' : '공유에 실패했어요.'};
  }
}

// Pointer tracking for drag games (bound after each render; no re-render while dragging).
function bindTracer(){const svg=document.getElementById('tracer');if(!svg||!session||session.game.over)return;
 const kind=svg.dataset.kind,trail=document.getElementById('tracerTrail'),dot=document.getElementById('tracerDot'),msg=document.getElementById('tracerMsg');
 let pts=null,done=false;
 const toBoard=e=>{const m=svg.getScreenCTM();if(!m)return null;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return [p.x,p.y,performance.now()];};
 const finish=()=>{if(done||!pts)return;done=true;const trace=pts;pts=null;
  session.game=kind==='maze'?playMaze(session.game,trace):playDraw(session.game,trace.map(p=>[p[0],p[1]]));session.hint=null;session.hintKey=null;
  if(session.game.over)complete();else render();};
 svg.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId);}catch(_){}const p=toBoard(e);if(!p)return;pts=[p];trail.setAttribute('points',`${p[0]},${p[1]}`);if(dot){dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);}
  if(kind==='maze'){const st=session.game.stages[session.game.turn];if(Math.hypot(p[0]-st.points[0][0],p[1]-st.points[0][1])>st.half+10){msg.textContent='초록 출발점에서 시작하세요';pts=null;}}});
 svg.addEventListener('pointermove',e=>{if(!pts||done)return;const p=toBoard(e);if(!p)return;pts.push(p);
  trail.setAttribute('points',trail.getAttribute('points')+` ${p[0].toFixed(1)},${p[1].toFixed(1)}`);if(dot){dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);}
  if(kind==='maze'){const st=session.game.stages[session.game.turn],goal=st.points.at(-1);
   if(!insideCorridor(st,p)){svg.classList.add('touched');finish();}
   else if(Math.hypot(p[0]-goal[0],p[1]-goal[1])<=st.half)finish();}});
 const up=()=>{if(pts&&pts.length>1)finish();else pts=null;};
 svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

function bindRedLight(){const btn=document.getElementById('rlBtn');if(!btn||!session||session.id!=='redlight'||session.game.over)return;
 const S=session;S.rl=S.rl||{holding:false,running:false,last:0};
 const down=e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId);}catch(_){}S.rl.holding=true;btn.classList.add('down');if(!S.rl.running){S.rl.running=true;S.rl.last=performance.now();requestAnimationFrame(tick);}};
 const up=()=>{S.rl.holding=false;btn.classList.remove('down');};
 btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up);btn.addEventListener('contextmenu',e=>e.preventDefault());
 function tick(now){if(session!==S||screen!=='game'){S.rl.running=false;return;}
  if(document.hidden)S.rl.holding=false;
  const dt=Math.min(60,now-S.rl.last);S.rl.last=now;S.game=stepRedLight(S.game,dt,S.rl.holding);const g=S.game,ph=phaseAt(g,g.t);
  const $=id=>document.getElementById(id);const field=$('rlField');

function rulesFor(id){return ({flip:['숫자를 4개 줄 중 하나에 넣어요.','같은 숫자 3개 또는 연속 숫자 3개면 점수 획득!','현재 숫자를 10에서 빼는 값으로 뒤집을 수 있어요. 총 6번!'],blind:['1~9 숫자 카드를 한 장씩 한 번만 사용해요.','AI도 숨긴 카드 한 장을 냅니다. 높은 카드가 승리!','9라운드 동안 가장 많이 이겨보세요.'],triad:['카드 9장 중에서 "세트"가 되는 3장을 골라요.','카드마다 특징이 3가지 있어요: 색(주황·청록·노랑), 모양(▲·●·◆), 개수(1·2·3개).','세트 조건: 색·모양·개수를 하나씩 따로 봤을 때, 각각 3장이 "전부 같거나" 아니면 "전부 다르거나" 해야 해요.','2장만 같고 1장만 다른 특징이 하나라도 있으면 세트가 아니에요. (아래 예시 참고)','총 5문제. 정답 +40점, 오답 -8점.'],trust:['6라운드 동안 AI와 협력 또는 배신을 골라요.','둘 다 협력하면 각 3점, 혼자 배신하면 5점을 얻어요.','둘 다 배신하면 각 1점. 상대의 패턴을 읽어야 해요.'],baseball:['1~9 중 서로 다른 숫자 3개로 된 비밀 번호를 맞혀요.','숫자와 자리가 모두 맞으면 스트라이크(S), 숫자만 맞으면 볼(B)이에요.','8번 안에 맞히면 성공! 빨리 맞힐수록 점수가 높아요(최고 100점).'],nim:['돌 더미에서 번갈아 1~3개씩 가져가요. 내가 먼저 시작해요.','마지막 돌을 가져가는 쪽이 그 판에서 져요.','3판 2선승! 한 판 이길 때마다 +30점. 수학으로 이길 수 있어요.'],auction:['보물 5개가 하나씩 경매에 나와요. 나와 AI 모두 30칩으로 시작해요.','몰래 입찰해서 더 많이 건 쪽이 보물을 가져가요. 같으면 아무도 못 가져가요(칩은 사라져요).','보물 가치×10점 + 남은 칩. 💣 함정 상자는 마이너스예요!'],maze:['초록 출발점을 누른 채로 손가락을 떼지 말고 깃발까지 길을 따라가요.','벽에 닿거나 손을 떼면 그 단계는 0점이에요.','5단계! 단계마다 길은 좁아지고 내 점은 커져요. 통과 40점 + 빠를수록 최대 20점.'],draw:['점선으로 보이는 모양을 손을 떼지 않고 한 번에 그려요.','선에 가까울수록, 모양을 끝까지 둘러 그릴수록 점수가 높아요(최고 100점).','5라운드: 동그라미·세모 → 하트·씽크칩 → 별·번개. 갈수록 채점이 깐깐해져요.'],marbles:['나와 AI 모두 구슬 10개로 시작해요. 한 번은 맞히고, 한 번은 숨기며 번갈아 10판!','맞히는 쪽은 홀·짝을 고르고 구슬을 걸어요. 맞히면 건 만큼 상대 구슬을 가져와요.','숨기는 쪽은 쥔 개수의 홀·짝만 중요해요. 남은 구슬 1개 = 10점.'],redlight:['버튼을 꾹 누르고 있으면 앞으로 가요. 결승선까지 25초!','술래가 돌아보면(👀) 바로 손을 떼세요. 시간이 갈수록 술래가 빨라지고, 높은 난이도엔 돌아보는 척(페이크)도 해요!','완주 100점 + 남은 시간 보너스. 탈락하면 간 거리만큼만 점수를 받아요.'],bridge:['안전한 돌이 하나씩 차례로 반짝여요. 잘 기억하세요!','왼쪽/오른쪽 중 안전한 돌을 골라 건너요. 틀리면 목숨 -1.','3단계, 갈수록 다리가 길어지고 보여주는 속도가 빨라져요. 고수부터는 돌이 3개!','한 번에 맞힌 칸 10점, 단계 통과 20점, 남은 목숨 10점씩.'],sudoku:['가로줄·세로줄·3×3 칸에 1~9가 한 번씩만 들어가요.','칸을 누르고 아래 숫자를 고르세요. 틀린 숫자는 들어가지 않고 실수 1회!','실수 3번이면 끝. 빨리 풀수록 점수가 높아요(최대 1000점).'],

function start(mode){

 const g=createRound(selectedGame,seed,difficulty);
 const challenger=mode==='friend'&&invitedGame===selectedGame&&invitedTarget!==null?{score:invitedTarget,name:invitedFrom}:null;
 session={id:selectedGame,mode,seed,difficulty,game:g,challenger,botTarget:mode==='ai'?aiTarget(selectedGame,seed,difficulty):null,flipped:false,hint:null,hintKey:null,award:0,input:[],bid:0,bet:1,preview:null,previewedStage:-1,rl:null,t0:0,sel:null};
 screen='game';rulesOpen=false;render();window.scrollTo?.(0,0);
}
function currentTurnKey(){const g=session.game;return session.id==='triad'||session.id==='minority'?g.round:session.id==='bridge'?`${g.stage}:${g.step}`:session.id==='redlight'?'rl':g.turn;}
function opponentScore(){if(!session)return null;if(session.mode==='live'){const o=liveOthers();return o.length?Math.max(...o.map(p=>p.score)):null;}if(session.challenger)return session.challenger.score;if(session.mode==='ai'){if(session.botTarget!==null)return session.botTarget;return session.game.cpuScore;}return null;}
function statusText(){
 if(!session)return '';
 if(session.mode==='solo')return '연습 모드 · 혼자 기록에 도전';
 if(session.mode==='live')return `실시간 대결 · 방 ${esc(live?.code||'')}`;
 if(session.challenger)return `${esc(session.challenger.name)}님의 기록 ${fmt(session.challenger.score)}점에 도전`;
 if(session.mode==='friend')return '친구에게 도전장을 보낼 기록 만들기';
