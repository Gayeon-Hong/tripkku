<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>트립꾸 · 알림 키 만들기</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;max-width:680px;margin:0 auto;padding:28px 18px 60px;line-height:1.7;color:#1b1e2e;background:#f5f6fa}button{min-height:48px;padding:0 20px;border:0;border-radius:999px;background:#1b1e2e;color:#fff;font-weight:900;font-size:15px}textarea{width:100%;min-height:74px;border-radius:14px;border:1px solid #e4e6ee;padding:10px;font:14px ui-monospace,monospace;box-sizing:border-box}label{display:block;font-weight:800;margin:18px 0 6px}.warn{background:#fff2e3;border-radius:14px;padding:12px 14px;font-weight:700}</style></head><body>
<h1>푸시 알림 키 만들기</h1>
<p>버튼을 누르면 이 브라우저 안에서 키 한 쌍이 만들어져요. 어디로도 전송되지 않고, 이 페이지를 닫으면 사라져요.</p>
<button id="make" type="button">키 한 쌍 만들기</button>
<label for="pub">공개 키 (VAPID_PUBLIC_KEY) — 앱에 넣는 값, 알려 줘도 됨</label><textarea id="pub" readonly></textarea>
<label for="priv">비밀 키 (VAPID_PRIVATE_KEY) — Supabase Secrets 에만</label><textarea id="priv" readonly></textarea>
<p class="warn">비밀 키는 Supabase → Edge Functions → Secrets 에만 넣고, 채팅·저장소·메신저에 올리지 마세요.</p>
<script>
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('make').addEventListener('click',async()=>{
 const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
 document.getElementById('pub').value=b64(await crypto.subtle.exportKey('raw',k.publicKey));
 document.getElementById('priv').value=(await crypto.subtle.exportKey('jwk',k.privateKey)).d;});
</script></body></html>
