const CASTLE = { s: 104 }; CASTLE.u = 100 + .46 * CASTLE.s; CASTLE.v = -34;

const PR = .45; // 캐릭터 반지름
function isBlocked(x, z) {
  const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
  for (let i = cx - 1; i <= cx + 1; i++) for (let j = cz - 1; j <= cz + 1; j++) {
    if (!blocked.has(cellKey(i, j))) continue;
    const nx = Math.max(i * CELL, Math.min(x, (i + 1) * CELL)), nz = Math.max(j * CELL, Math.min(z, (j + 1) * CELL));
    if ((x - nx) ** 2 + (z - nz) ** 2 < PR * PR) return true;
  }

}

  if (isBlocked(p.x, p.z) || !isBlocked(p.x + dx, p.z + dz)) { p.x += dx; p.z += dz; return; }
  if (!isBlocked(p.x + dx, p.z)) p.x += dx; else if (!isBlocked(p.x, p.z + dz)) p.z += dz;
}

  if (kind === 'rain') { snow.material.color.set(0xa9c2ff); snow.material.size = .12; snow.material.opacity = .55; env.fall = 7; }
  else { snow.material.color.set(0xffffff); snow.material.size = .22; snow.material.opacity = .9; env.fall = 1; }
  env.fog = kind === 'fog' ? .35 : kind === 'cloudy' || kind === 'rain' ? .75 : 1; env.day = day;
  document.getElementById('env').textContent = weatherLine();
}
const modeBtn = document.getElementById('mode');
const paintMode = () => { modeBtn.textContent = MODE === 'real' ? '🕒' : '🌙'; modeBtn.title = MODE === 'real' ? '실제 시간·날씨 (누르면 겨울밤)' : '겨울밤 (누르면 실제 시간·날씨)'; envT = 0; shown = undefined; };
modeBtn.onclick = () => { MODE = MODE === 'real' ? 'night' : 'real'; try { localStorage.setItem('tk-world-mode', MODE); } catch {} paintMode(); };
// 앱에서 고른 날짜 일정에 나오는 도시: 광장 위 '📍 오늘 일정' + 순간이동 버튼 강조
const TODAY = (new URLSearchParams(location.search).get('today') || '').split(',').filter(k => ZONES[k]);
for (const k of TODAY) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,210,122,.92)'; x.beginPath(); x.roundRect(36, 14, 440, 100, 50); x.fill();
  x.fillStyle = '#3a2a10'; x.font = '56px Jua, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('📍 오늘 일정', 256, 66);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sp.scale.set(10, 2.5, 1); sp.position.copy(ZONES[k].pos).setY(groundAt(ZONES[k].pos.x, ZONES[k].pos.z) + 12); sp.userData.noCol = true; scene.add(sp);
  tickers.push(() => { sp.position.y = groundAt(ZONES[k].pos.x, ZONES[k].pos.z) + 12 + Math.sin(performance.now() / 500) * .4; });
  document.querySelector(`#warp [data-z="${k}"]`)?.classList.add('today');
}

// ---------- 캐릭터: 각자 자기 캐릭터를 조종하고, 같은 월드(room)에 들어온 가족이 보인다 ----------
const WHO = { me: { i: 0, label: '나' }, mom: { i: 1, label: '엄마' }, dad: { i: 2, label: '아빠' } };
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'family').slice(0, 64);
const glbCache = {};
// 가족 3D 모델(next/assets/models/family_*.glb)을 받는 동안은 손으로 만든 미니 캐릭터를 보여준다
function makeChar(who, label) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body); root.userData.noCol = true; scene.add(root);
  chibi(FAMILY[WHO[who].i], body);
  const url = `../next/assets/models/family_${who}.glb`;
  (glbCache[url] ||= new Promise((ok, no) => loader.load(url, gl => ok(gl.scene), undefined, no))).then(src => {
    const m = src.clone(), sz = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
    m.scale.setScalar(3 / sz.y); const bb = new THREE.Box3().setFromObject(m); m.position.y -= bb.min.y;
    m.traverse(o => { if (o.isMesh) o.castShadow = true; });
    body.clear(); body.add(m);
  }).catch(() => {});
  root.add(nameTag(label)); return { root, body, who, walk: 0 };
}
function nameTag(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 72; const x = c.getContext('2d');
  x.font = '36px Jua, sans-serif'; const w = Math.min(244, x.measureText(text).width + 36);
  x.fillStyle = 'rgba(20,28,74,.72)'; x.beginPath(); x.roundRect((256 - w) / 2, 8, w, 54, 27); x.fill();
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 128, 37);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  sp.scale.set(2.2, .62, 1); sp.position.y = 3.6; sp.renderOrder = 9; return sp;
}
let me = null; // 내 캐릭터
const player = new THREE.Group(); // 입장 전에도 카메라가 볼 자리
player.position.set(0, 0, 8);
const CLOSE = params.has("close"); // ?close = 가까이 보기
const pick = document.getElementById('pick');
function enter(who) {
  try { localStorage.setItem('tk-world-who', who); } catch {}
  pick.style.display = 'none';
  if (me) scene.remove(me.root);
  me = makeChar(who, who === 'me' ? '나' : WHO[who].label + ' (나)'); me.root.position.copy(player.position);
  { const fl = new THREE.PointLight(0xffe2c0, 16, 10); fl.position.set(0, 4, 3); me.root.add(fl); } // 내 캐릭터 비추는 따뜻한 조명
  net.join(who);
}
pick.querySelectorAll('button').forEach(b => b.onclick = () => enter(b.dataset.who));

// ---------- 동시 접속 (Supabase Realtime 방송 채널, 저장은 안 함) ----------
const others = new Map(); // id → {char, to:{x,z,ry}, seen}
const onlineBox = document.getElementById('online');
const net = (() => {
  const id = (crypto.randomUUID?.() || String(Math.random()).slice(2)).slice(0, 12);
  let ch = null, last = '', lastAt = 0, ready = false;
  function showOnline() {
    const names = [me && (me.who === 'me' ? '나' : WHO[me.who].label + '(나)'), ...[...others.values()].map(o => WHO[o.char.who].label)].filter(Boolean);
    onlineBox.textContent = names.length ? '👥 ' + names.join(' · ') : '';
  }
  function upsert(p) {
    if (!p || p.id === id || !WHO[p.who]) return;
    let o = others.get(p.id);
    if (o && o.char.who !== p.who) { scene.remove(o.char.root); o = null; }
    if (!o) { const c = makeChar(p.who, WHO[p.who].label); c.root.position.set(p.x, 0, p.z); o = { char: c, to: { x: p.x, z: p.z, ry: p.ry } }; others.set(p.id, o); showOnline(); }
    o.to = { x: p.x, z: p.z, ry: p.ry }; o.seen = performance.now();
  }
  function drop(pid) { const o = others.get(pid); if (o) { scene.remove(o.char.root); others.delete(pid); showOnline(); } }
  function join(who) {
    showOnline();
    if (ch) { ch.track({ who }); return; }
    try {
      const sb = createClient(CONFIG.supabaseUrl, CONFIG.supabasePublishableKey, { auth: { persistSession: false, autoRefreshToken: false }, realtime: { params: { eventsPerSecond: 20 } } });
      ch = sb.channel('tripkku-world:' + ROOM, { config: { broadcast: { self: false }, presence: { key: id } } });
      ch.on('broadcast', { event: 'p' }, ({ payload }) => upsert(payload));
      ch.on('broadcast', { event: 'bye' }, ({ payload }) => drop(payload?.id));
      ch.on('broadcast', { event: 'touch' }, () => window.__plaque && sparkle(window.__plaque.position));
      ch.on('presence', { event: 'leave' }, ({ key }) => drop(key));
      ch.subscribe(async st => { if (st === 'SUBSCRIBED') { ready = true; await ch.track({ who: me?.who }); send(true); } });
      addEventListener('pagehide', () => ch?.send({ type: 'broadcast', event: 'bye', payload: { id } }));
    } catch (e) { console.warn('동시 접속 연결 실패', e); }
  }
  function send(force) {
    if (!ready || !me) return;
    const p = me.root.position, ry = me.body.rotation.y, now = performance.now();
    const msg = { id, who: me.who, x: +p.x.toFixed(2), z: +p.z.toFixed(2), ry: +ry.toFixed(2) }, key = msg.x + ',' + msg.z + ',' + msg.ry + msg.who;
    if (!force && key === last && now - lastAt < 2000) return; // 가만히 있으면 2초마다 한 번만
    if (!force && now - lastAt < 90) return;
    last = key; lastAt = now; ch.send({ type: 'broadcast', event: 'p', payload: msg });
  }
  setInterval(() => { const now = performance.now(); for (const [k, o] of others) if (now - (o.seen || 0) > 12000) drop(k); }, 3000);
  return { join, send, touch: () => ready && ch.send({ type: 'broadcast', event: 'touch', payload: { id } }) };
})();
{ const saved = params.get('who') || (() => { try { return localStorage.getItem('tk-world-who'); } catch { return null; } })();
  if (saved && WHO[saved] && params.get('who')) enter(saved); // 앱의 입장 버튼은 내 캐릭터를 정해서 보낸다
  else if (saved && WHO[saved]) pick.querySelector(`[data-who="${saved}"]`).style.outline = '3px solid #ffd27a'; }

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
let camYaw = 0, camPitch = .42, joy = null, look = null, camDist = CLOSE ? 5.5 : 14, pinch = null;
const touches = new Map();
const setDist = v => camDist = THREE.MathUtils.clamp(v, 3.5, 95);
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
const jv = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' && joy == null) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (e.pointerType !== 'mouse' && touches.size >= 2 && !joy) { // 두 손가락 = 확대/축소
    const [p, q] = [...touches.values()]; pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), dist: camDist }; look = null; return;
  }
  if (e.pointerType !== 'mouse' && e.clientX < innerWidth / 2 && !joy) {
    joy = { id: e.pointerId, x: e.clientX, y: e.clientY };
    Object.assign(stick.style, { display: 'block', left: e.clientX - 55 + 'px', top: e.clientY - 55 + 'px' });
  } else look = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) { const [p, q] = [...touches.values()]; setDist(pinch.dist * pinch.d / Math.max(20, Math.hypot(p.x - q.x, p.y - q.y))); return; }
  if (joy && e.pointerId === joy.id) {
    jv.set(e.clientX - joy.x, e.clientY - joy.y); if (jv.length() > 45) jv.setLength(45);
    knob.style.transform = `translate(${jv.x}px,${jv.y}px)`;
  } else if (look && e.pointerId === look.id) {
    camYaw -= (e.clientX - look.x) * .006; camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - look.y) * .004, .15, 1.1);
    look.x = e.clientX; look.y = e.clientY;
  }
});
const endPtr = e => {
  touches.delete(e.pointerId); if (touches.size < 2) pinch = null;
  if (joy && e.pointerId === joy.id) { joy = null; jv.set(0, 0); stick.style.display = 'none'; knob.style.transform = ''; }
  if (look && e.pointerId === look.id) look = null;
};
addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); setDist(camDist * Math.exp(e.deltaY * .0012)); }, { passive: false });
document.getElementById('zin').onclick = () => setDist(camDist / 1.4);
document.getElementById('zout').onclick = () => setDist(camDist * 1.4);
document.getElementById('zall').onclick = () => { if (camDist > 60) { setDist(14); camPitch = .42; } else { setDist(92); camPitch = 1.05; } }; // 🗺 한 번 더 누르면 원래대로
document.querySelectorAll('#warp button').forEach(b => b.onclick = () => {
  const z = ZONES[b.dataset.z]; (me ? me.root : player).position.copy(z.warp || z.pos.clone().multiplyScalar(.6)); camYaw = Math.atan2(-Math.cos(z.ang), -Math.sin(z.ang)); camPitch = .3; if (camDist > 30) setDist(14); net.send(true);
});

// ---------- 루프 ----------
const card = document.getElementById('card'), cardB = card.querySelector('b'), cardP = card.querySelector('p');
let shown = null, walkT = 0, touchMsg = 0, reach = 0;
const sparks = [], touchBtn = document.getElementById('touch');
function sparkle(at) { for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.OctahedronGeometry(.08), new THREE.MeshBasicMaterial({ color: [0xffe08a, 0xffffff, 0xffc35a][i % 3], transparent: true, toneMapped: false })); m.position.copy(at); scene.add(m); sparks.push({ m, life: 1.4, v: new THREE.Vector3((Math.random() - .5) * 2.4, 1 + Math.random() * 2, (Math.random() - .5) * 2.4) }); } }
touchBtn.onclick = () => { if (!me) return; const pq = window.__plaque; me.body.rotation.y = Math.atan2(pq.position.x - me.root.position.x, pq.position.z - me.root.position.z); reach = 1.2; sparkle(pq.position); touchMsg = clock.elapsedTime + 4; net.touch(); };
const clock = new THREE.Clock(), camPos = new THREE.Vector3(), tmp = new THREE.Vector3();
function frame() {
  const d = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  // 이동 입력 (카메라 기준) — 내 캐릭터만
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + jv.x / 45;
  let iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + jv.y / 45;
  const mv = new THREE.Vector3(ix, 0, iz);
  if (me) {
    const P = me.root.position;
    if (mv.lengthSq() > .01) {
      mv.clampLength(0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
      const ox = P.x, oz = P.z;
      moveWithCollision(P, mv.x * d * 9, mv.z * d * 9);
      // 성: 길·마당으로만. 벽·지붕·허공 쪽이면 막히고, 비스듬히 부딪히면 벽을 따라 미끄러진다
      if (!castleStepOk(ox, oz, P.x, P.z)) { const nx = P.x, nz = P.z; if (castleStepOk(ox, oz, nx, oz)) P.z = oz; else if (castleStepOk(ox, oz, ox, nz)) P.x = ox; else { P.x = ox; P.z = oz; } }
      me.body.rotation.y = THREE.MathUtils.lerp(me.body.rotation.y, Math.atan2(mv.x, mv.z), .2);
      walkT += d * 12;
    } else walkT = 0;
    { const [pu, pv] = toUV(P.x, P.z), lim = castleGround(P.x, P.z) != null ? 400 : pu > 40 && Math.abs(pv) < 38 ? 99 : 64; if (P.length() > lim) P.setLength(lim); }
    { const gy = surfaceAt(P.x, P.z); P.y = gy > P.y + .3 ? THREE.MathUtils.lerp(P.y, gy, Math.min(1, d * 10)) : gy; } // 높은 턱은 폴짝 올라가듯
    me.body.position.y = Math.abs(Math.sin(walkT)) * .25; me.body.rotation.z = Math.sin(walkT) * .08;
    player.position.copy(P); net.send(false);
  }
  // 다른 가족: 받은 위치로 부드럽게 걸어간다
  for (const o of others.values()) {
    const c = o.char, dv = new THREE.Vector3(o.to.x - c.root.position.x, 0, o.to.z - c.root.position.z), dl = dv.length();
    if (dl > 6) c.root.position.set(o.to.x, 0, o.to.z); // 순간이동
    else if (dl > .05) { c.root.position.addScaledVector(dv, Math.min(1, d * 8)); c.walk += d * 12; } else c.walk = 0;
    c.root.position.y = surfaceAt(c.root.position.x, c.root.position.z);
    c.body.rotation.y = THREE.MathUtils.lerp(c.body.rotation.y, o.to.ry, .2);
    c.body.position.y = Math.abs(Math.sin(c.walk)) * .22; c.body.rotation.z = Math.sin(c.walk) * .07;
  }
  // 카메라 (멀리 볼수록 위에서, 안개도 멀리)
  const dist = camDist;
  camPos.set(Math.sin(camYaw) * Math.cos(camPitch) * dist, Math.sin(camPitch) * dist + 1.5, Math.cos(camYaw) * Math.cos(camPitch) * dist).add(player.position);
  camera.position.lerp(camPos, t < .5 ? 1 : .12);
  camera.lookAt(tmp.copy(player.position).setY(player.position.y + 2.2));
  scene.fog.near = (45 + dist) * (env.fog ?? 1) * .8 + 4; scene.fog.far = (150 + dist * 2.2) * (env.fog ?? 1);
  moon.position.copy(player.position).add(new THREE.Vector3(-30, 50, 20)); moon.target.position.copy(player.position);
  // 눈
  for (let i = 0; i < SN; i++) {
    let y = snowPos[i * 3 + 1] - d * (1.5 + (i % 5) * .3) * env.fall; if (y < 0) y += 40;
    snowPos[i * 3 + 1] = y; snowPos[i * 3] += Math.sin(t + i) * d * .3;
  }
  snowGeo.attributes.position.needsUpdate = true; snow.position.set(player.position.x, player.position.y, player.position.z);
  applyEnv(d);
  tickers.forEach(f => f(d));
  // 근처 도시 카드
  let near = null;
  for (const [k, z] of Object.entries(ZONES)) if (Math.hypot(player.position.x - z.pos.x, player.position.z - z.pos.z) < 20) near = k;
  { const [pu, pv] = toUV(player.position.x, player.position.z); if (onDeck(pu, pv) && pu > KB.ramp1) near = 'charles'; }
  if (touchMsg && t < touchMsg) near = 'touched';
  if (near !== shown) {
    shown = near; card.classList.toggle('on', !!near);
    const info = near === 'touched' ? { name: '✨ 소원 빌었어요!', text: '네포무크 상을 만졌어요. 언젠가 프라하에 꼭 다시 오게 된대요.' } : ZONES[near] || CARDS[near];
    if (info) { cardB.textContent = info.name; cardP.textContent = info.text; const w = weatherLine(); if (w) { const e = document.createElement('small'); e.className = 'wx'; e.textContent = w; cardP.append(document.createElement('br'), e); } }
  }
  // 네포무크 부조 가까이 가면 '만지기' 버튼
  const pq = window.__plaque, canTouch = me && pq && Math.hypot(player.position.x - pq.position.x, player.position.z - pq.position.z) < 2.8;
  touchBtn.hidden = !canTouch;
  for (let i = sparks.length - 1; i >= 0; i--) { const sp = sparks[i]; sp.life -= d; sp.m.position.addScaledVector(sp.v, d); sp.v.y -= d * 1.5; sp.m.material.opacity = Math.max(0, sp.life); if (sp.life <= 0) { scene.remove(sp.m); sparks.splice(i, 1); } }
  if (reach > 0 && me) { reach -= d; me.body.rotation.x = Math.sin(Math.min(1, (1.2 - reach) / 1.2) * Math.PI) * .35; } else if (me) me.body.rotation.x = 0;
  composer.render();
  requestAnimationFrame(frame);
}
paintMode(); rebuildCollision(); setTimeout(rebuildCollision, 1500);
frame();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
