  /* 위쪽 제목·도시 버튼 접기: 위로 밀면 접히고 아래로 밀면(또는 손잡이 톡) 다시 나온다 */

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh'; // 성 바닥 레이캐스트를 빠르게
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm';
import { CONFIG } from '../next/config.js';

// ---------- 기본 세팅 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // 2배는 폰에서 너무 무거움
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141c4a);
scene.fog = new THREE.Fog(0x1a2456, 45, 150);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.5, 0.95); composer.addPass(bloom);
composer.addPass(new OutputPass());
// 안전망: 불러온 모델의 법선이 길이 0·NaN 이면 빛 번짐(bloom)이 NaN 을 퍼뜨려 화면이 통째로 검게 깜빡인다 → 위쪽 법선으로 바꿔 둔다
{ const parse = GLTFLoader.prototype.parse;
  GLTFLoader.prototype.parse = function (data, path, onLoad, onError) {
    return parse.call(this, data, path, gl => {
      gl.scene.traverse(o => { if (!o.isMesh) return; const g = o.geometry;
        if (!g.attributes.normal) g.computeVertexNormals();
        const n = g.attributes.normal, F = new Float32Array(n.count * 3); let bad = false;
        for (let i = 0; i < n.count; i++) { let x = n.getX(i), y = n.getY(i), z = n.getZ(i), l = Math.hypot(x, y, z);
          if (!(l > .1)) { x = 0; y = 1; z = 0; l = 1; bad = true; } F[i * 3] = x / l; F[i * 3 + 1] = y / l; F[i * 3 + 2] = z / l; }
        if (bad) g.setAttribute('normal', new THREE.BufferAttribute(F, 3));
        const mt = o.material; if (mt?.map) { mt.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); mt.map.needsUpdate = true; } }); // 비스듬히·멀리 볼 때 무늬가 뭉개지지 않게
      onLoad(gl);
    }, onError);
  }; }

const hemi = new THREE.HemisphereLight(0x8aa0ff, 0x2a2f55, .55); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xb8c8ff, .9);
moon.position.set(-30, 50, 20);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 150 });
scene.add(moon, moon.target);

// ---------- 재질 헬퍼 ----------
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });
const glow = (c, k = 2.2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m;
}

// ---------- 하늘: 별 + 눈 ----------
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, fog: false, transparent: true });
{
  const g = new THREE.BufferGeometry(), p = [];
  for (let i = 0; i < 1500; i++) {
    const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) + .05;
    p.push(...v.normalize().multiplyScalar(300).toArray());
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, starMat));
}
const snowGeo = new THREE.BufferGeometry(), SN = 2500, snowPos = new Float32Array(SN * 3);
for (let i = 0; i < SN; i++) snowPos.set([(Math.random() - .5) * 120, Math.random() * 40, (Math.random() - .5) * 120], i * 3);
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: .22, transparent: true, opacity: .9 }));
scene.add(snow);

// ---------- 바닥 ----------
const ground = mesh(new THREE.CircleGeometry(95, 64), M(0xaab6dc, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false;
scene.add(ground);

// ---------- 존 정의 (도시 3곳) ----------
const ZONES = {
  dresden: { ang: -Math.PI / 2, name: '🇩🇪 드레스덴 · 프라우엔 교회',
    text: '전쟁 때 무너졌다가 2005년에 원래 돌로 다시 지은 성당이에요. 겨울엔 슈트리첼마르크트(1434년부터 열린 크리스마스 마켓)에서 슈톨렌 먹기!' },
  prague: { ang: Math.PI / 6, name: '🇨🇿 프라하 · 틴 성당',
    text: '구시가지 광장의 뾰족한 쌍둥이 첨탑. 바로 옆 천문시계가 정각마다 움직여요. 광장 크리스마스 마켓에서 뜨르들로 꼭!' },
  berlin: { ang: Math.PI * 5 / 6, name: '🇩🇪 베를린 · 브란덴부르크 문',
    text: '1791년에 세운 문. 꼭대기엔 승리의 여신이 모는 네 마리 말 마차(크바드리가)! 뒤로 보이는 TV 타워는 368m. 겨울엔 크리스마스 마켓에서 커리부어스트와 글뤼바인.' },
};
const R = 42;
for (const z of Object.values(ZONES)) z.pos = new THREE.Vector3(Math.cos(z.ang) * R, 0, Math.sin(z.ang) * R);
// ---------- 프라하 가는 길: 중앙 → 계단 → 까를교(블타바 강 위) → 탑 문 → 언덕 → 틴 성당 광장 ----------
// u = 프라하 쪽으로 간 거리, v = 옆 방향. 다리 모델(Meshy)은 받침대를 잘라내고 19배로 키워 탑 문을 캐릭터가 지나가게 했다.
const OUT = new THREE.Vector3(Math.cos(ZONES.prague.ang), 0, Math.sin(ZONES.prague.ang)), SIDE = new THREE.Vector3(-OUT.z, 0, OUT.x);
const KB = { S: 19, mid: 28.07, w: .06, deck: 4.15, vmin: -3.4, vmax: 3.0, ramp0: 3, ramp1: 11.5, river0: 10, river1: 46.2, tw0: 40.6, tw1: 44.6, gate: 1.2, hill0: 44.5, plat: 52, top: 7 };
ZONES.prague.pos.copy(OUT).multiplyScalar(72); ZONES.prague.warp = OUT.clone().multiplyScalar(56);
const toUV = (x, z) => [x * OUT.x + z * OUT.z, x * SIDE.x + z * SIDE.z];
const fromUV = (u, v, y = 0) => new THREE.Vector3(OUT.x * u + SIDE.x * v, y, OUT.z * u + SIDE.z * v);
const smooth = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
const onDeck = (u, v) => v > KB.vmin && v < KB.vmax && u >= KB.ramp0 && u < KB.hill0;
function groundAt(x, z) {
  const [u, v] = toUV(x, z);
  if (u >= KB.hill0) return (KB.deck + (KB.top - KB.deck) * smooth(KB.hill0 + 2, KB.plat, u)) * (1 - smooth(30, 40, Math.abs(v)));
  if (onDeck(u, v)) return u < KB.ramp1 ? KB.deck * (u - KB.ramp0) / (KB.ramp1 - KB.ramp0) : KB.deck;
  return 0;
}
// 사람이 못 들어가는 곳: 강물, 계단·다리 옆, 탑 벽(가운데 문만 통과)
function noWalk(x, z) {
  const [u, v] = toUV(x, z);
  if (u >= KB.ramp0 && u < KB.river0 && (v <= KB.vmin + .5 || v >= KB.vmax - .5) && v > KB.vmin - 1.5 && v < KB.vmax + 1.5) return true; // 계단 옆 벽
  if (u >= KB.river0 && u < KB.river1 && u < KB.hill0) { // 언덕(hill0~)부터는 땅이라 탑 문을 나와서 걸을 수 있다
    if (!onDeck(u, v) || v <= KB.vmin + .5 || v >= KB.vmax - .5) return true;
    if (u >= KB.tw0 && u < KB.tw1 && Math.abs(v) > KB.gate) return true;
  }
  return false;
}


const colliders = []; // (예전 원형 충돌 — 지금은 아래 격자를 씀)
const addCol = (x, z, r) => colliders.push({ x, z, r });
// ---------- 충돌 격자: 실제 모양(상자·Meshy 삼각형)이 캐릭터 몸 높이(0.4~2.2)에 걸치는 칸을 막는다 ----------
// CS: 캐릭터 크기 배율. 사람·동물을 줄여서 건물·노점·놀이기구 사이가 상대적으로 1/CS 배 넓어지게(프라하 지형처럼 좌표에 묶인 곳은 그대로라 안 깨짐)
const CS = .72;
const CELL = .5, BAND = [.3, 1.65], blocked = new Set();
const cellKey = (x, z) => x + ',' + z;
function markRect(x0, z0, x1, z1) {
  for (let x = Math.floor(x0 / CELL); x <= Math.floor(x1 / CELL); x++) for (let z = Math.floor(z0 / CELL); z <= Math.floor(z1 / CELL); z++) blocked.add(cellKey(x, z));
}
function rebuildCollision() {
  blocked.clear(); scene.updateMatrixWorld(true);
  const box = new THREE.Box3(), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const walk = o => {
    if (!o.visible || o.userData.noCol) return;
    if (o.isMesh && !o.isInstancedMesh && o.geometry?.attributes?.position) {
      if (o.userData.glb) { // Meshy 모델: 삼각형마다
        const pos = o.geometry.attributes.position, idx = o.geometry.index, n = idx ? idx.count : pos.count, m = o.matrixWorld;
        for (let i = 0; i < n; i += 3) {

rideBox.querySelector('.no').onclick = () => rideBox.hidden = true;
function ride(k) {
  rideBox.hidden = true; fadeEl.textContent = '🚋 ' + toCity(k) + ' 가는 중…'; fadeEl.classList.add('on');
  setTimeout(() => { goZone(k); setTimeout(() => fadeEl.classList.remove('on'), 500); }, 1300);
}
tramBtn.onclick = () => tramNear && askRide(tramNear.key);

// ---------- 루프 ----------
const card = document.getElementById('card'), cardB = card.querySelector('b'), cardP = card.querySelector('p');
card.addEventListener('click', () => { card.classList.remove('on'); cardReq = false; }); // 누르면 닫힘
// 설명 카드는 화면을 두 번 톡(더블클릭) 했을 때만: 지금 있는 곳(도시·까를교) 설명을 띄운다
let cardReq = false, lastTap = null;
renderer.domElement.addEventListener('dblclick', () => { cardReq = true; shown = undefined; });
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') return; const n = performance.now();
  if (lastTap && n - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { cardReq = true; shown = undefined; lastTap = null; } else lastTap = { t: n, x: e.clientX, y: e.clientY }; });
let shown = null, walkT = 0, touchMsg = 0, reach = 0;
const sparks = [], touchBtn = document.getElementById('touch');
function sparkle(at) { for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.OctahedronGeometry(.08), new THREE.MeshBasicMaterial({ color: [0xffe08a, 0xffffff, 0xffc35a][i % 3], transparent: true, toneMapped: false })); m.position.copy(at); scene.add(m); sparks.push({ m, life: 1.4, v: new THREE.Vector3((Math.random() - .5) * 2.4, 1 + Math.random() * 2, (Math.random() - .5) * 2.4) }); } }
touchBtn.onclick = () => { if (!me) return; const pq = window.__plaque; me.body.rotation.y = Math.atan2(pq.position.x - me.root.position.x, pq.position.z - me.root.position.z); reach = 1.2; sparkle(pq.position); touchMsg = clock.elapsedTime + 4; net.touch(); };
const clock = new THREE.Clock(), camPos = new THREE.Vector3(), tmp = new THREE.Vector3();
function frame() {
  const d = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  // 이동 입력 (카메라 기준) — 내 캐릭터만
  // 스틱: 가운데 12px 은 무시하고, 살짝 밀면 천천히·끝까지 밀면 제 속도(곡선)
  const jl = jv.length(), jm = jl < 12 ? 0 : Math.pow(Math.min(1, (jl - 12) / 43), 1.6), jx = jl ? jv.x / jl * jm : 0, jz = jl ? jv.y / jl * jm : 0;
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + jx;
  let iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + jz;
  const mv = new THREE.Vector3(ix, 0, iz);
  if (mv.lengthSq() > .0004 || !me) tapTo = null; // 직접 움직이면 톡 이동은 취소
  else if (tapTo) { const dx = tapTo.x - me.root.position.x, dz = tapTo.z - me.root.position.z, dl = Math.hypot(dx, dz);
    const last = !tapTo.pts || tapTo.i >= tapTo.pts.length - 1;
    if (dl < (last ? .6 : .45) && !last) { tapTo.i++; tapTo.x = tapTo.pts[tapTo.i][0]; tapTo.z = tapTo.pts[tapTo.i][1]; }
    if ((last && dl < .6) || performance.now() > tapTo.until) tapTo = null; else if (dl > .01) mv.set(dx / dl, 0, dz / dl).applyAxisAngle(new THREE.Vector3(0, 1, 0), -camYaw); } // 아래에서 camYaw만큼 다시 돌림
  if (me) {
    const P = me.root.position;
    const ice = onIce(P.x, P.z);
    if (ice) { // 얼음 위: 밀면 천천히 붙는 속도, 손을 떼도 쭉 미끄러진다
      if (mv.lengthSq() > .01) mv.clampLength(0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
      skateV.lerp(mv.multiplyScalar(7), Math.min(1, d * (mv.lengthSq() > .01 ? 1.6 : .5)));
      if (skateV.lengthSq() > .04) { moveWithCollision(P, skateV.x * d, skateV.z * d); me.body.rotation.y = THREE.MathUtils.lerp(me.body.rotation.y, Math.atan2(skateV.x, skateV.z), .08); }
      me.body.rotation.z = THREE.MathUtils.lerp(me.body.rotation.z, -skateV.clone().cross(new THREE.Vector3(Math.sin(me.body.rotation.y), 0, Math.cos(me.body.rotation.y))).y * .02, .1); // 도는 쪽으로 기울기
      walkT = 0;
    } else if (mv.lengthSq() > .0004) {

      const ox = P.x, oz = P.z;
      moveWithCollision(P, mv.x * d * WALK, mv.z * d * WALK);

      if (!tapTo && !look?.go && !pinch) { const want = Math.atan2(-mv.x, -mv.z); let da = want - camYaw; da = Math.atan2(Math.sin(da), Math.cos(da)); if (Math.abs(da) < 2.2) camYaw += da * Math.min(1, d * .6 * mv.length()); } // 스틱·키보드로 걸을 때만, 천천히(톡 이동 땐 안 돎 — 누를 때마다 뱅글 돌았다)
      // 성: 길·마당으로만. 벽·지붕·허공 쪽이면 막히고, 비스듬히 부딪히면 벽을 따라 미끄러진다
      if (!castleStepOk(ox, oz, P.x, P.z)) { const nx = P.x, nz = P.z; if (castleStepOk(ox, oz, nx, oz)) P.z = oz; else if (castleStepOk(ox, oz, ox, nz)) P.x = ox; else { P.x = ox; P.z = oz; } }
      me.body.rotation.y = THREE.MathUtils.lerp(me.body.rotation.y, Math.atan2(mv.x, mv.z), .2);
      walkT += d * 12;
    } else { walkT = 0; skateV.set(0, 0, 0); }
    { const [pu, pv] = toUV(P.x, P.z), lim = castleGround(P.x, P.z) != null || stairH(P.x, P.z) != null || (pu > 40 && pu <= 102 + CASTLE.back && Math.abs(pv) < 38) ? 400 : 64; /* 언덕은 성 바위 앞(u≈120)까지 — 예전엔 반지름 99에서 막혀 트램 너머로 못 갔다(언덕 끝은 castleStepOk 가 막음) */ if (P.length() > lim) P.setLength(lim); }
    { const gy = surfaceAt(P.x, P.z); P.y = gy > P.y + .3 ? THREE.MathUtils.lerp(P.y, gy, Math.min(1, d * 10)) : gy; } // 높은 턱은 폴짝 올라가듯
    if (!ice) { me.body.position.y = Math.abs(Math.sin(walkT)) * .18; me.body.rotation.z = Math.sin(walkT) * .08; } else me.body.position.y = 0;
    player.position.copy(P); net.send(false);
  }
  // 다른 가족: 받은 위치로 부드럽게 걸어간다
  for (const o of others.values()) {
    const c = o.char, dv = new THREE.Vector3(o.to.x - c.root.position.x, 0, o.to.z - c.root.position.z), dl = dv.length();
    if (dl > 6) c.root.position.set(o.to.x, 0, o.to.z); // 순간이동
    else if (dl > .05) { c.root.position.addScaledVector(dv, Math.min(1, d * 8)); c.walk += d * 12; } else c.walk = 0;
    c.root.position.y = surfaceAt(c.root.position.x, c.root.position.z);
    c.body.rotation.y = THREE.MathUtils.lerp(c.body.rotation.y, o.to.ry, .2);
    c.body.position.y = Math.abs(Math.sin(c.walk)) * .16; c.body.rotation.z = Math.sin(c.walk) * .07;
  }
  // 카메라 (멀리 볼수록 위에서, 안개도 멀리)
  const dist = camDist;
  if (jv.length() > 20 || keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD || keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight) camPan.multiplyScalar(Math.max(0, 1 - d * 3)); // 스틱·키보드로 걸을 때만 화면이 다시 나를 따라옴(톡 이동·한 번 터치로는 옮겨 둔 화면 유지, 🗺 로 되돌리기)
  camTarget.copy(player.position).add(camPan);
  camPos.set(Math.sin(camYaw) * Math.cos(camPitch) * dist, Math.sin(camPitch) * dist + 1.5, Math.cos(camYaw) * Math.cos(camPitch) * dist).add(camTarget);
  camera.position.lerp(camPos, t < .5 ? 1 : .12);
  camera.lookAt(tmp.copy(camTarget).setY(camTarget.y + 1.6));
  scene.fog.near = (45 + dist) * (env.fog ?? 1) * .8 + 4; scene.fog.far = (150 + dist * 2.2) * (env.fog ?? 1);
  moon.position.copy(camTarget).add(new THREE.Vector3(-30, 50, 20)); moon.target.position.copy(camTarget);
  // 눈
  for (let i = 0; i < SN; i++) {
    let y = snowPos[i * 3 + 1] - d * (1.5 + (i % 5) * .3) * env.fall; if (y < 0) y += 40;
    snowPos[i * 3 + 1] = y; snowPos[i * 3] += Math.sin(t + i) * d * .3;
  }
  snowGeo.attributes.position.needsUpdate = true; snow.position.set(camTarget.x, player.position.y, camTarget.z);
  { const sK = Math.max(1, camDist / 40); snow.scale.setScalar(sK); snow.material.size = (env.flake || .22) * Math.sqrt(sK); } // 멀리 볼수록 눈 내리는 범위도 넓게(예전엔 내 주변 120칸만 내려서 축소하면 한 도시에만 오는 것처럼 보였다)
  applyEnv(d);
  tickers.forEach(f => f(d));
  // 근처 도시 카드
  let near = null;
  for (const [k, z] of Object.entries(ZONES)) if (Math.hypot(player.position.x - z.pos.x, player.position.z - z.pos.z) < 20) near = k;
  { const [pu, pv] = toUV(player.position.x, player.position.z); if (onDeck(pu, pv) && pu > KB.ramp1) near = 'charles'; }
  if (touchMsg && t < touchMsg) near = 'touched';
  if (!near) cardReq = false; // 그곳을 떠나면 닫힘
  if (near !== 'touched' && !cardReq) near = null; // 두 번 톡 했을 때만 보여 줌(소원 빈 알림은 바로)
  if (near !== shown) {
    shown = near; card.classList.toggle('on', !!near);
    const info = near === 'touched' ? { name: '✨ 소원 빌었어요!', text: '네포무크 상을 만졌어요. 언젠가 프라하에 꼭 다시 오게 된대요.' } : ZONES[near] || CARDS[near];
    if (info) { cardB.textContent = info.name; cardP.textContent = info.text; const w = weatherLine(); if (w) { const e = document.createElement('small'); e.className = 'wx'; e.textContent = w; cardP.append(document.createElement('br'), e); } }
  }
  // 네포무크 부조 가까이 가면 '만지기' 버튼
  const pq = window.__plaque, canTouch = me && pq && Math.hypot(player.position.x - pq.position.x, player.position.z - pq.position.z) < 2.8;
  touchBtn.hidden = !canTouch;
  tramNear = me ? tramStops.find(s => Math.hypot(player.position.x - s.g.position.x, player.position.z - s.g.position.z) < 9) : null;
  tramBtn.hidden = !tramNear || !rideBox.hidden;
  for (let i = sparks.length - 1; i >= 0; i--) { const sp = sparks[i]; sp.life -= d; sp.m.position.addScaledVector(sp.v, d); sp.v.y -= d * 1.5; sp.m.material.opacity = Math.max(0, sp.life); if (sp.life <= 0) { scene.remove(sp.m); sparks.splice(i, 1); } }
  if (reach > 0 && me) { reach -= d; me.body.rotation.x = Math.sin(Math.min(1, (1.2 - reach) / 1.2) * Math.PI) * .35; } else if (me) me.body.rotation.x = 0;
  composer.render();

}
paintMode(); rebuildCollision(); setTimeout(rebuildCollision, 1500);
frame();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
